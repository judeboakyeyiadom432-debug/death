<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lumen Library – Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b1226;--panel:#121b36;--line:#243158;--text:#e9eefc;--muted:#97a5c9;--cyan:#6fd8f5;--violet:#a498ff;--ok:#6ee0a8;--bad:#ff8f9a;
--head:"Bricolage Grotesque",Georgia,"Segoe UI",sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:62px}
.logo{font:700 19px var(--head)}.logo span{color:var(--violet);font-weight:500;margin-left:6px}
.sp{flex:1}.who{color:var(--muted);font-size:14px}
h1,h2{font-family:var(--head);margin:0;letter-spacing:-.01em}
h2{font-size:21px}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--cyan);color:#07101f}
.btn:hover{background:#9be6fa}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.alt:hover{border-color:var(--violet)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.del{color:var(--bad)}.btn.del:hover{border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.login{max-width:400px;margin:90px auto}
.login h1{font-size:28px;margin-bottom:6px}.login p{color:var(--muted);margin:0 0 20px}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--cyan)}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.layout{display:grid;grid-template-columns:400px 1fr;gap:24px;margin:28px 0 60px;align-items:start}
.drop{display:block;text-align:center;border:1.5px dashed #3a4a7c;border-radius:10px;padding:24px 14px;margin:14px 0 18px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--cyan);background:rgba(111,216,245,.06)}
.drop.has{border-style:solid;border-color:var(--ok);background:rgba(110,224,168,.07)}
.drop input{display:none}.drop small{color:var(--muted)}
.prog{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:14px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--cyan);transition:width .15s}
.msg{border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:none}
.msg.bad{display:block;background:rgba(255,143,154,.1);border-left:3px solid var(--bad)}
.msg.warn{display:block;background:rgba(164,152,255,.12);border-left:3px solid var(--violet)}
.head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.head input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:200px;outline:0}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0}.item b{display:block;font-weight:600;overflow-wrap:anywhere}
.item small{color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;margin-left:8px;border:1px solid}
.pill.on{color:var(--ok);border-color:var(--ok)}.pill.off{color:var(--muted);border-color:var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);text-align:center;padding:36px 10px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1b2750;border:1px solid var(--line);border-radius:8px;padding:11px 18px;transition:.25s;z-index:9;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.item{flex-wrap:wrap}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<header><div class="wrap bar"><div class="logo">Lumen Library<span>Admin</span></div><span class="sp"></span><span class="who" id="who"></span><button class="btn alt sm" id="out" hidden>Sign out</button></div></header>

<main class="wrap">
<section class="login panel" id="login" hidden>
  <h1>Admin sign in</h1><p>Use the admin account you created in Supabase.</p>
  <div class="msg" id="lmsg"></div>
  <label class="f">Email<input id="em" type="email" autocomplete="username"></label>
  <label class="f">Password<input id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn" id="signin" style="width:100%">Sign in</button>
</section>

<div id="app" hidden>
  <div class="layout">
    <section class="panel">
      <h2>Add a PDF</h2>
      <div class="msg" id="role"></div>
      <label class="drop" id="drop"><input type="file" id="file" accept="application/pdf"><strong id="dt">Drop a PDF here, or click to choose one</strong><br><small id="ds">PDF, up to 25 MB</small></label>
      <label class="f">Title<input id="t" maxlength="140" placeholder="e.g. Waves and optics notes"></label>
      <label class="f">Subject<select id="s"></select></label>
      <label class="f">Description<textarea id="d" placeholder="What will students find inside?"></textarea></label>
      <label class="f" style="max-width:160px">Pages (optional)<input id="pg" type="number" min="1"></label>
      <div class="prog" id="prog"><i></i></div>
      <div class="msg" id="umsg"></div>
      <button class="btn" id="up" disabled style="width:100%">Upload and publish</button>
    </section>
    <section class="panel">
      <div class="head"><h2>All PDFs <small id="n" style="color:var(--muted);font-weight:400"></small></h2><input id="find" type="search" placeholder="Search your PDFs"></div>
      <div id="list"></div>
    </section>
  </div>
</div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* Fill in your Supabase project URL and public anon key (never the service_role key). */
const CFG={url:'',key:'',table:'pdfs',bucket:'death'};
const GROUPS={
'Core':['English Language','Core Mathematics','Integrated Science','Social Studies'],
'Sciences':['Elective Mathematics','Physics','Chemistry','Biology','Elective ICT'],
'Business':['Financial Accounting','Cost Accounting','Business Management','Economics'],
'Humanities & Languages':['Government','History','Geography','Literature in English','Christian Religious Studies','Islamic Religious Studies','French','Ghanaian Language'],
'Creative Arts':['General Knowledge in Art','Graphic Design','Picture Making','Ceramics','Sculpture','Textiles','Leatherwork','Basketry','Music','Physical Education'],
'Home Econ & Agric':['Food and Nutrition','Management in Living','Clothing and Textiles','General Agriculture','Animal Husbandry','Crop Husbandry and Horticulture'],
'Technical':['Technical Drawing','Building Construction','Applied Electricity','Electronics','Auto Mechanics','Metalwork','Woodwork']};
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,ROWS=[],FILE=null,tt;
try{S=JSON.parse(localStorage.getItem('lumen-admin')||'null')}catch(e){}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000)}
function show(el,type,text){el.className='msg'+(text?' '+type:'');el.textContent=text||''}
function save(s){S=s;try{s?localStorage.setItem('lumen-admin',JSON.stringify(s)):localStorage.removeItem('lumen-admin')}catch(e){}}
function mk(j){const p=JSON.parse(atob(j.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return{access:j.access_token,refresh:j.refresh_token,exp:p.exp,email:p.email,role:(p.app_metadata||{}).role}}
async function token(body,grant){const r=await fetch(`${CFG.url}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign-in failed');return mk(j)}
async function fresh(){if(S&&S.exp-Date.now()/1e3<90){try{save(await token({refresh_token:S.refresh},'refresh_token'))}catch(e){logout();throw new Error('Session expired. Sign in again.')}}}
async function api(path,opt={}){await fresh();return fetch(CFG.url+path,{...opt,headers:{apikey:CFG.key,Authorization:'Bearer '+S.access,...(opt.headers||{})}})}
async function err(r){try{const j=await r.json();return j.message||j.error||j.hint||('Error '+r.status)}catch(e){return 'Error '+r.status}}
function logout(){save(null);start()}

/* sign in */
$('signin').onclick=async()=>{show($('lmsg'));try{save(await token({email:$('em').value.trim(),password:$('pw').value},'password'));$('pw').value='';start()}catch(e){show($('lmsg'),'bad',e.message)}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('signin').click()};
$('out').onclick=logout;

function start(){
  const ok=S&&CFG.url&&CFG.key;
  $('login').hidden=!!ok;$('app').hidden=!ok;$('out').hidden=!ok;$('who').textContent=ok?S.email:'';
  if(!CFG.url||!CFG.key){$('login').hidden=false;show($('lmsg'),'warn','Add your Supabase URL and anon key at the top of this file’s script first.');return}
  if(!ok)return;
  show($('role'),'warn',S.role==='admin'?'':'This account is not marked as an admin yet, so uploads will be refused. Run the admin block at the end of supabase-setup.sql, then sign out and back in.');
  loadList();
}

/* subject list */
Object.entries(GROUPS).forEach(([g,l])=>{const og=document.createElement('optgroup');og.label=g;l.forEach(n=>og.appendChild(new Option(n,n)));$('s').appendChild(og)});

/* file picking */
const ready=()=>$('up').disabled=!(FILE&&$('t').value.trim());
async function pick(f){
  if(!f)return;
  if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){show($('umsg'),'bad','Only PDF files can be added.');return}
  if(f.size>26214400){show($('umsg'),'bad','That file is over 25 MB.');return}
  show($('umsg'));FILE=f;$('drop').classList.add('has');$('dt').textContent=f.name;$('ds').textContent=(f.size/1048576).toFixed(1)+' MB. Click to choose a different file.';
  if(!$('t').value)$('t').value=f.name.replace(/\.pdf$/i,'').replace(/[-_]+/g,' ');
  try{const m=(await f.text()).match(/\/Type\s*\/Page(?![s\w])/g);if(m&&!$('pg').value)$('pg').value=m.length}catch(e){}
  ready();
}
$('file').onchange=e=>pick(e.target.files[0]);
const dr=$('drop');
['dragenter','dragover'].forEach(n=>dr.addEventListener(n,e=>{e.preventDefault();dr.classList.add('over')}));
['dragleave','drop'].forEach(n=>dr.addEventListener(n,e=>{e.preventDefault();dr.classList.remove('over')}));
dr.addEventListener('drop',e=>pick(e.dataTransfer.files[0]));
$('t').oninput=ready;

/* upload */
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'file';
function send(path,file,onp){return new Promise(async(res,rej)=>{await fresh();const x=new XMLHttpRequest();x.open('POST',`${CFG.url}/storage/v1/object/${CFG.bucket}/${path}`);
x.setRequestHeader('apikey',CFG.key);x.setRequestHeader('Authorization','Bearer '+S.access);x.setRequestHeader('Content-Type','application/pdf');x.setRequestHeader('x-upsert','false');
x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total);
x.onload=()=>{if(x.status<300)return res();let m='';try{m=JSON.parse(x.responseText).message}catch(e){}rej(new Error(m||'Upload failed ('+x.status+')'))};
x.onerror=()=>rej(new Error('Network error. Check your connection.'));x.send(file)})}
$('up').onclick=async()=>{
  const title=$('t').value.trim(),subject=$('s').value,path=slug(subject)+'/'+slug(title)+'-'+Date.now().toString(36)+'.pdf';
  $('up').disabled=true;show($('umsg'));$('prog').style.display='block';$('prog').firstChild.style.width='0';
  try{
    await send(path,FILE,p=>$('prog').firstChild.style.width=(p*100)+'%');
    const r=await api(`/rest/v1/${CFG.table}`,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({title,subject,description:$('d').value.trim()||null,file_path:path,file_size:FILE.size,page_count:+$('pg').value||null,published:true})});
    if(!r.ok){const m=await err(r);await api(`/storage/v1/object/${CFG.bucket}/${path}`,{method:'DELETE'});throw new Error(m)}
    toast('Published: '+title);
    FILE=null;$('file').value='';$('drop').classList.remove('has');$('dt').textContent='Drop a PDF here, or click to choose one';$('ds').textContent='PDF, up to 25 MB';$('t').value='';$('d').value='';$('pg').value='';
    loadList();
  }catch(e){show($('umsg'),'bad',e.message)}
  $('prog').style.display='none';ready();
};

/* list */
async function loadList(){
  $('list').innerHTML='<div class="empty">Loading…</div>';
  try{const r=await api(`/rest/v1/${CFG.table}?select=*&order=created_at.desc`);if(!r.ok)throw new Error(await err(r));ROWS=await r.json();drawList()}
  catch(e){$('list').innerHTML='<div class="empty">Couldn’t load the list: '+esc(e.message)+'</div>'}
}
function drawList(){
  const k=$('find').value.trim().toLowerCase(),rows=ROWS.filter(x=>(x.title+x.subject).toLowerCase().includes(k));
  $('n').textContent='('+rows.length+')';
  $('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><div class="t"><b>${esc(x.title)}<span class="pill ${x.published?'on':'off'}">${x.published?'Live':'Hidden'}</span></b><small>${esc(x.subject)} · ${x.file_size?(x.file_size/1048576).toFixed(1)+' MB · ':''}${new Date(x.created_at).toLocaleDateString()}</small></div>
  <div class="acts"><a class="btn alt sm" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(CFG.url+'/storage/v1/object/public/'+CFG.bucket+'/'+encodeURI(x.file_path))}">Open</a><button class="btn alt sm" data-tg="${x.id}">${x.published?'Hide':'Show'}</button><button class="btn alt sm del" data-rm="${x.id}">Delete</button></div></div>`).join(''):'<div class="empty">'+(ROWS.length?'No PDFs match that search.':'No PDFs yet. Add your first one on the left.')+'</div>';
}
$('find').oninput=drawList;
$('list').onclick=async e=>{
  const tg=e.target.closest('[data-tg]'),rm=e.target.closest('[data-rm]');
  try{
    if(tg){const x=ROWS.find(r=>r.id===tg.dataset.tg);const r=await api(`/rest/v1/${CFG.table}?id=eq.${x.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({published:!x.published})});if(!r.ok)throw new Error(await err(r));x.published=!x.published;drawList();toast(x.published?'Now live':'Hidden from the site')}
    if(rm){const x=ROWS.find(r=>r.id===rm.dataset.rm);if(!confirm('Delete “'+x.title+'” and its file? This cannot be undone.'))return;
      const r=await api(`/rest/v1/${CFG.table}?id=eq.${x.id}`,{method:'DELETE'});if(!r.ok)throw new Error(await err(r));
      await api(`/storage/v1/object/${CFG.bucket}/${encodeURI(x.file_path)}`,{method:'DELETE'});ROWS=ROWS.filter(r=>r!==x);drawList();toast('Deleted')}
  }catch(er){toast(er.message)}
};
start();
</script>
</body>

      <h2>Add a PDF</h2>
      <div class="msg" id="role"></div>
      <label class="drop" id="drop"><input type="file" id="file" accept="application/pdf"><strong id="dt">Drop a PDF here, or click to choose one</strong><br><small id="ds">PDF, up to 25 MB</small></label>
      <label class="f">Title<input id="t" maxlength="140" placeholder="e.g. Waves and optics notes"></label>
      <label class="f">Subject<select id="s"></select></label>
      <label class="f">Description<textarea id="d" placeholder="What will students find inside?"></textarea></label>
      <label class="f" style="max-width:160px">Pages (optional)<input id="pg" type="number" min="1"></label>
      <div class="prog" id="prog"><i></i></div>
      <div class="msg" id="umsg"></div>
      <button class="btn" id="up" disabled style="width:100%">Upload and publish</button>
    </section>
    <section class="panel">
      <div class="head"><h2>All PDFs <small id="n" style="color:var(--muted);font-weight:400"></small></h2><input id="find" type="search" placeholder="Search your PDFs"></div>
      <div id="list"></div>
    </section>
  </div>
</div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* Fill in your Supabase project URL and public anon key (never the service_role key). */
const CFG={url:'',key:'',table:'pdfs',bucket:'death'};
const GROUPS={
'Core':['English Language','Core Mathematics','Integrated Science','Social Studies'],
'Sciences':['Elective Mathematics','Physics','Chemistry','Biology','Elective ICT'],
'Business':['Financial Accounting','Cost Accounting','Business Management','Economics'],
'Humanities & Languages':['Government','History','Geography','Literature in English','Christian Religious Studies','Islamic Religious Studies','French','Ghanaian Language'],
'Creative Arts':['General Knowledge in Art','Graphic Design','Picture Making','Ceramics','Sculpture','Textiles','Leatherwork','Basketry','Music','Physical Education'],
'Home Econ & Agric':['Food and Nutrition','Management in Living','Clothing and Textiles','General Agriculture','Animal Husbandry','Crop Husbandry and Horticulture'],
'Technical':['Technical Drawing','Building Construction','Applied Electricity','Electronics','Auto Mechanics','Metalwork','Woodwork']};
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,ROWS=[],FILE=null,tt;
try{S=JSON.parse(localStorage.getItem('lumen-admin')||'null')}catch(e){}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000)}
function show(el,type,text){el.className='msg'+(text?' '+type:'');el.textContent=text||''}
function save(s){S=s;try{s?localStorage.setItem('lumen-admin',JSON.stringify(s)):localStorage.removeItem('lumen-admin')}catch(e){}}
function mk(j){const p=JSON.parse(atob(j.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return{access:j.access_token,refresh:j.refresh_token,exp:p.exp,email:p.email,role:(p.app_metadata||{}).role}}
async function token(body,grant){const r=await fetch(`${CFG.url}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign-in failed');return mk(j)}
async function fresh(){if(S&&S.exp-Date.now()/1e3<90){try{save(await token({refresh_token:S.refresh},'refresh_token'))}catch(e){logout();throw new Error('Session expired. Sign in again.')}}}
async function api(path,opt={}){await fresh();return fetch(CFG.url+path,{...opt,headers:{apikey:CFG.key,Authorization:'Bearer '+S.access,...(opt.headers||{})}})}
async function err(r){try{const j=await r.json();return j.message||j.error||j.hint||('Error '+r.status)}catch(e){return 'Error '+r.status}}
function logout(){save(null);start()}

/* sign in */
$('signin').onclick=async()=>{show($('lmsg'));try{save(await token({email:$('em').value.trim(),password:$('pw').value},'password'));$('pw').value='';start()}catch(e){show($('lmsg'),'bad',e.message)}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('signin').click()};
$('out').onclick=logout;

function start(){
  const ok=S&&CFG.url&&CFG.key;
  $('login').hidden=!!ok;$('app').hidden=!ok;$('out').hidden=!ok;$('who').textContent=ok?S.email:'';
  if(!CFG.url||!CFG.key){$('login').hidden=false;show($('lmsg'),'warn','Add your Supabase URL and anon key at the top of this file’s script first.');return}
  if(!ok)return;
  show($('role'),'warn',S.role==='admin'?'':'This account is not marked as an admin yet, so uploads will be refused. Run the admin block at the end of supabase-setup.sql, then sign out and back in.');
  loadList();
}

/* subject list */
Object.entries(GROUPS).forEach(([g,l])=>{const og=document.createElement('optgroup');og.label=g;l.forEach(n=>og.appendChild(new Option(n,n)));$('s').appendChild(og)});

/* file picking */
const ready=()=>$('up').disabled=!(FILE&&$('t').value.trim());
async function pick(f){
  if(!f)return;
  if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){show($('umsg'),'bad','Only PDF files can be added.');return}
  if(f.size>26214400){show($('umsg'),'bad','That file is over 25 MB.');return}
  show($('umsg'));FILE=f;$('drop').classList.add('has');$('dt').textContent=f.name;$('ds').textContent=(f.size/1048576).toFixed(1)+' MB. Click to choose a different file.';
  if(!$('t').value)$('t').value=f.name.replace(/\.pdf$/i,'').replace(/[-_]+/g,' ');
  try{const m=(await f.text()).match(/\/Type\s*\/Page(?![s\w])/g);if(m&&!$('pg').value)$('pg').value=m.length}catch(e){}
  ready();
}
$('file').onchange=e=>pick(e.target.files[0]);
const dr=$('drop');
['dragenter','dragover'].forEach(n=>dr.addEventListener(n,e=>{e.preventDefault();dr.classList.add('over')}));
['dragleave','drop'].forEach(n=>dr.addEventListener(n,e=>{e.preventDefault();dr.classList.remove('over')}));
dr.addEventListener('drop',e=>pick(e.dataTransfer.files[0]));
$('t').oninput=ready;

/* upload */
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'file';
function send(path,file,onp){return new Promise(async(res,rej)=>{await fresh();const x=new XMLHttpRequest();x.open('POST',`${CFG.url}/storage/v1/object/${CFG.bucket}/${path}`);
x.setRequestHeader('apikey',CFG.key);x.setRequestHeader('Authorization','Bearer '+S.access);x.setRequestHeader('Content-Type','application/pdf');x.setRequestHeader('x-upsert','false');
x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total);
x.onload=()=>{if(x.status<300)return res();let m='';try{m=JSON.parse(x.responseText).message}catch(e){}rej(new Error(m||'Upload failed ('+x.status+')'))};
x.onerror=()=>rej(new Error('Network error. Check your connection.'));x.send(file)})}
$('up').onclick=async()=>{
  const title=$('t').value.trim(),subject=$('s').value,path=slug(subject)+'/'+slug(title)+'-'+Date.now().toString(36)+'.pdf';
  $('up').disabled=true;show($('umsg'));$('prog').style.display='block';$('prog').firstChild.style.width='0';
  try{
    await send(path,FILE,p=>$('prog').firstChild.style.width=(p*100)+'%');
    const r=await api(`/rest/v1/${CFG.table}`,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({title,subject,description:$('d').value.trim()||null,file_path:path,file_size:FILE.size,page_count:+$('pg').value||null,published:true})});
    if(!r.ok){const m=await err(r);await api(`/storage/v1/object/${CFG.bucket}/${path}`,{method:'DELETE'});throw new Error(m)}
    toast('Published: '+title);
    FILE=null;$('file').value='';$('drop').classList.remove('has');$('dt').textContent='Drop a PDF here, or click to choose one';$('ds').textContent='PDF, up to 25 MB';$('t').value='';$('d').value='';$('pg').value='';
    loadList();
  }catch(e){show($('umsg'),'bad',e.message)}
  $('prog').style.display='none';ready();
};

/* list */
async function loadList(){
  $('list').innerHTML='<div class="empty">Loading…</div>';
  try{const r=await api(`/rest/v1/${CFG.table}?select=*&order=created_at.desc`);if(!r.ok)throw new Error(await err(r));ROWS=await r.json();drawList()}
  catch(e){$('list').innerHTML='<div class="empty">Couldn’t load the list: '+esc(e.message)+'</div>'}
}
function drawList(){
  const k=$('find').value.trim().toLowerCase(),rows=ROWS.filter(x=>(x.title+x.subject).toLowerCase().includes(k));
  $('n').textContent='('+rows.length+')';
  $('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><div class="t"><b>${esc(x.title)}<span class="pill ${x.published?'on':'off'}">${x.published?'Live':'Hidden'}</span></b><small>${esc(x.subject)} · ${x.file_size?(x.file_size/1048576).toFixed(1)+' MB · ':''}${new Date(x.created_at).toLocaleDateString()}</small></div>
  <div class="acts"><a class="btn alt sm" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(CFG.url+'/storage/v1/object/public/'+CFG.bucket+'/'+encodeURI(x.file_path))}">Open</a><button class="btn alt sm" data-tg="${x.id}">${x.published?'Hide':'Show'}</button><button class="btn alt sm del" data-rm="${x.id}">Delete</button></div></div>`).join(''):'<div class="empty">'+(ROWS.length?'No PDFs match that search.':'No PDFs yet. Add your first one on the left.')+'</div>';
}
$('find').oninput=drawList;
$('list').onclick=async e=>{
  const tg=e.target.closest('[data-tg]'),rm=e.target.closest('[data-rm]');
  try{
    if(tg){const x=ROWS.find(r=>r.id===tg.dataset.tg);const r=await api(`/rest/v1/${CFG.table}?id=eq.${x.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({published:!x.published})});if(!r.ok)throw new Error(await err(r));x.published=!x.published;drawList();toast(x.published?'Now live':'Hidden from the site')}
    if(rm){const x=ROWS.find(r=>r.id===rm.dataset.rm);if(!confirm('Delete “'+x.title+'” and its file? This cannot be undone.'))return;
      const r=await api(`/rest/v1/${CFG.table}?id=eq.${x.id}`,{method:'DELETE'});if(!r.ok)throw new Error(await err(r));
      await api(`/storage/v1/object/${CFG.bucket}/${encodeURI(x.file_path)}`,{method:'DELETE'});ROWS=ROWS.filter(r=>r!==x);drawList();toast('Deleted')}
  }catch(er){toast(er.message)}
};
start();
</script>
</body>
