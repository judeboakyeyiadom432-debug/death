<script>
/* Question format: [level 1-3, question, [options], correctIndex, explanation] */
const S=[
{n:"English Language",g:0,t:[
["Concord",[
[1,"Choose the correct word: She ___ to school every day.",["go","goes","going","gone"],1,"A singular subject (she) takes a singular verb: goes."],
[2,"Choose the correct word: Each of the students ___ a book.",["have","has","are having","were having"],1,"Each is singular, so it takes has."],
[3,"Choose the correct word: Neither the manager nor the workers ___ ready.",["is","are","was","has been"],1,"With neither … nor, the verb agrees with the nearer subject (workers), so it is plural."]],
`<p>Concord means the verb agrees with its subject in number. A singular subject takes a singular verb (she goes), and a plural subject takes a plural verb (they go).</p><ul><li>Each, every, either, neither and everyone are singular.</li><li>With either … or and neither … nor, the verb agrees with the nearer subject.</li><li>A collective noun such as team or committee is singular when it acts as one unit.</li><li>Ignore words between the subject and verb: The box of books is heavy.</li></ul>`],
["Tenses",[
[1,"Choose the correct word: I ___ my homework yesterday.",["did","do","done","doing"],0,"Yesterday signals the simple past: did."],
[2,"Choose the correct form: By the time we arrived, the film ___.",["started","had started","has started","starts"],1,"The film started before we arrived, so we use the past perfect: had started."],
[3,"Choose the correct form: If I ___ harder, I would have passed.",["studied","study","had studied","would study"],2,"A third conditional uses the past perfect in the if-clause: had studied."]],
`<p>Tenses show when an action happens.</p><ul><li><b>Simple present:</b> habits and facts (she goes).</li><li><b>Simple past:</b> finished actions (she went).</li><li><b>Present perfect:</b> have or has + past participle, for past actions that matter now (she has gone).</li><li><b>Past perfect:</b> had + past participle, for an action before another past action (she had gone before we came).</li><li><b>Third conditional:</b> If + past perfect, would have + past participle.</li></ul>`]]},
{n:"Core Mathematics",g:0,t:[
["Algebra",[
[1,"Solve x + 7 = 12.",["3","5","7","19"],1,"Subtract 7 from both sides: x = 5."],
[2,"Solve 3x − 5 = 16.",["3","5","7","11"],2,"Add 5: 3x = 21. Divide by 3: x = 7."],
[3,"What are the roots of x² − 5x + 6 = 0?",["−2 and −3","2 and 3","1 and 6","−1 and −6"],1,"Factorise: (x − 2)(x − 3) = 0, so x = 2 or x = 3."]],`<p>Algebra uses letters to stand for unknown numbers. To solve an equation, do the same thing to both sides until the letter is alone.</p><ul><li><b>Linear equation:</b> 3x − 5 = 16. Add 5 to both sides to get 3x = 21, then divide by 3 to get x = 7.</li><li><b>Quadratic equation:</b> x² − 5x + 6 = 0. Find two numbers that multiply to 6 and add to −5 (these are −2 and −3). Then (x − 2)(x − 3) = 0, so x = 2 or x = 3.</li></ul><p>Tip: check your answer by putting it back into the original equation.</p><h3>1. Expressions, expanding and factorising</h3><p>A term is a number, a letter or a product of both. Like terms have the same letters and powers, and only they can be added or subtracted. To expand, multiply every term inside the bracket. To factorise, do the reverse.</p><div class='ex'>3(2x − 5) + 4x = 6x − 15 + 4x = 10x − 15<br>Common factor: 6x² + 9x = 3x(2x + 3)<br>Difference of two squares: x² − 49 = (x − 7)(x + 7)<br>Trinomial: x² + 7x + 12 = (x + 3)(x + 4), because 3 × 4 = 12 and 3 + 4 = 7</div><h3>2. Linear equations</h3><p>Treat an equation like a balance. Whatever you do to one side, do to the other. Clear brackets and fractions first.</p><div class='ex'>2(x + 3) = 3x − 1 → 2x + 6 = 3x − 1 → 7 = x<br>(x + 1) ÷ 2 + x ÷ 3 = 5. Multiply everything by 6: 3(x + 1) + 2x = 30, so 5x = 27 and x = 5.4.</div><h3>3. Quadratic equations</h3><p>A quadratic has the form ax² + bx + c = 0. There are three ways to solve one.</p><ul><li><b>Factorising:</b> x² − 5x + 6 = 0 becomes (x − 2)(x − 3) = 0, so x = 2 or 3.</li><li><b>Formula:</b> x = (−b ± √(b² − 4ac)) ÷ 2a. For 2x² + 3x − 4 = 0, the part under the root is 9 + 32 = 41, so x = (−3 ± 6.403) ÷ 4, giving x ≈ 0.85 or −2.35.</li><li><b>Completing the square:</b> rewrite as (x + p)² = q, then take the square root of both sides.</li></ul><p>The <b>discriminant</b> b² − 4ac tells you how many real roots there are: positive means two, zero means one repeated root, negative means none.</p><h3>4. Inequalities</h3><p>Solve them like equations, with one extra rule: when you multiply or divide by a <b>negative</b> number, reverse the sign.</p><div class='ex'>3 − 2x &gt; 11 → −2x &gt; 8 → x &lt; −4<br>−3 &lt; 2x + 1 ≤ 9 → −4 &lt; 2x ≤ 8 → −2 &lt; x ≤ 4</div><h3>5. Changing the subject of a formula</h3><p>Get the letter you want on its own using inverse operations. From v = u + at, subtract u and divide by a to get t = (v − u) ÷ a. From A = πr², divide by π and take the square root: r = √(A ÷ π).</p><h3>6. Variation</h3><ul><li><b>Direct:</b> y = kx. If y = 12 when x = 4, then k = 3, so when x = 7, y = 21.</li><li><b>Inverse:</b> y = k ÷ x. If y = 6 when x = 4, then k = 24, so when x = 8, y = 3.</li></ul><p>Always find k first, then use it.</p><h3>Common mistakes</h3><ul><li>Forgetting that a minus sign outside a bracket changes every sign inside: −(x − 3) = −x + 3.</li><li>Not reversing the inequality sign after dividing by a negative.</li><li>Dividing both sides by x in x² = 5x. You lose the solution x = 0. Use x(x − 5) = 0 instead.</li></ul><p class='tip'>Exam tip: for a quadratic, try factorising first. If it does not factorise within about 30 seconds, move to the formula.</p>`],
["Fractions and percentages",[
[1,"What is 1/2 + 1/4?",["2/6","3/4","1/8","2/4"],1,"1/2 = 2/4, and 2/4 + 1/4 = 3/4."],
[2,"What is 15% of 200?",["15","20","30","45"],2,"0.15 × 200 = 30."],
[3,"A price rises from GH₵80 to GH₵100. What is the percentage increase?",["20%","25%","30%","125%"],1,"Increase = 20. 20 ÷ 80 × 100 = 25%."]],`<p>To add fractions, give them the same denominator first: 1/2 + 1/4 = 2/4 + 1/4 = 3/4.</p><p>To find a percentage of a number, change it to a decimal and multiply: 15% of 200 = 0.15 × 200 = 30.</p><p><b>Percentage change</b> = (change ÷ original) × 100. From GH₵80 to GH₵100, that is 20 ÷ 80 × 100 = 25%. Always divide by the original value, not the new one.</p><h3>1. Working with fractions</h3><ul><li><b>Add or subtract:</b> find the lowest common denominator first. 2/3 + 3/4 = 8/12 + 9/12 = 17/12 = 1 5/12.</li><li><b>Multiply:</b> multiply tops and bottoms, and cancel first if you can. 3/5 × 10/9 = 30/45 = 2/3.</li><li><b>Divide:</b> flip the second fraction and multiply. 2/3 ÷ 4/9 = 2/3 × 9/4 = 3/2.</li><li><b>Mixed numbers:</b> change to improper fractions first. 2 1/2 + 1 2/3 = 5/2 + 5/3 = 25/6 = 4 1/6.</li></ul><h3>2. Fractions, decimals and percentages</h3><p>They are three ways of writing the same number. To change a fraction to a decimal, divide the top by the bottom. To change a decimal to a percentage, multiply by 100.</p><div class='ex'>3/8 = 0.375 = 37.5%<br>0.06 = 6%<br>45% = 45/100 = 9/20</div><h3>3. Percentages of an amount and percentage change</h3><div class='ex'>Percentage of an amount: 15% of 200 = 0.15 × 200 = 30<br>One quantity as a percentage of another: 18 out of 24 = 18/24 × 100 = 75%<br>Increase 60 by 25%: 60 × 1.25 = 75<br>Decrease 60 by 20%: 60 × 0.8 = 48</div><p>To find a <b>reverse percentage</b>, divide by the multiplier. After a 20% discount a shirt costs GH₵240. The multiplier is 0.8, so the original price was 240 ÷ 0.8 = GH₵300.</p><h3>4. Profit and loss</h3><p>Profit % = (profit ÷ cost price) × 100. If you buy for GH₵150 and sell for GH₵180, the profit is 30, so the profit is 30 ÷ 150 × 100 = 20%. Loss works the same way.</p><h3>5. Simple and compound interest</h3><ul><li><b>Simple:</b> I = PRT ÷ 100. GH₵1,000 at 8% for 3 years gives I = 240, so the amount is GH₵1,240.</li><li><b>Compound:</b> A = P(1 + R ÷ 100)ⁿ. GH₵1,000 at 8% for 2 years gives 1,000 × 1.08² = GH₵1,166.40.</li></ul><p>Compound interest earns interest on interest, so it grows faster than simple interest.</p><h3>6. Rounding and standard form</h3><p>Decimal places count digits after the point. Significant figures count from the first non-zero digit: 0.04567 is 0.046 to 2 s.f. Standard form writes a number as a × 10ⁿ with 1 ≤ a &lt; 10. So 45,000 = 4.5 × 10⁴ and 0.0032 = 3.2 × 10⁻³.</p><h3>Common mistakes</h3><ul><li>Adding the denominators: 1/2 + 1/3 is not 2/5.</li><li>Dividing a percentage change by the new value instead of the original.</li><li>Multiplying instead of dividing in a reverse-percentage problem.</li></ul><p class='tip'>Exam tip: write the multiplier first (1.25 for +25%, 0.8 for −20%). It makes increases, decreases, reverse percentages and compound interest all quicker.</p>`],
["Surds",[
[1,"Simplify √12.",["6","2√3","3√2","4√3"],1,"√12 = √4 × √3 = 2√3."],
[2,"Simplify √27 + √12.",["√39","5√3","6√3","5√6"],1,"√27 = 3√3 and √12 = 2√3, so the sum is 5√3."],
[3,"Rationalise the denominator of 1 ÷ (2 + √3).",["2 + √3","2 − √3","(2 − √3) ÷ 7","1 ÷ 2"],1,"Multiply top and bottom by (2 − √3). The denominator becomes 4 − 3 = 1, leaving 2 − √3."]],
`<p>A surd is a root that cannot be written as an exact fraction, such as √2 or √3. To simplify one, take out perfect-square factors: √12 = √4 × √3 = 2√3.</p><ul><li><b>Add or subtract</b> only like surds: 2√3 + 5√3 = 7√3. Simplify first, so √27 + √12 becomes 3√3 + 2√3.</li><li><b>Multiply</b> using √a × √b = √(ab).</li><li><b>Rationalise</b> a denominator by multiplying top and bottom by a surd or by the conjugate. For 1 ÷ (2 + √3), multiply by (2 − √3) on top and bottom.</li></ul><h3>1. Rational and irrational numbers</h3><p>A rational number can be written as a fraction of two integers, such as 3, 0.25 or −4/7. An irrational number cannot, and its decimal never ends or repeats (π and √2 are examples). A <b>surd</b> is an irrational root left in root form, such as √2, √5 or ∛4. Note that √16 is <b>not</b> a surd, because it equals exactly 4.</p><h3>2. Simplifying surds</h3><p>Two rules do most of the work: √a × √b = √(ab) and √(a ÷ b) = √a ÷ √b. To simplify, split the number under the root into a perfect square times another number, then take the square root of the perfect square.</p><div class='ex'><b>Examples.</b><br>√72 = √(36 × 2) = 6√2<br>√50 = √(25 × 2) = 5√2<br>√48 = √(16 × 3) = 4√3</div><p class='tip'>Learn the perfect squares: 4, 9, 16, 25, 36, 49, 64, 81, 100. Always look for the largest one that divides your number. If you used a smaller one, keep simplifying until nothing more comes out.</p><h3>3. Adding and subtracting surds</h3><p>You can only combine <b>like surds</b>, which have the same number under the root. Simplify each surd first, then add or subtract the coefficients.</p><div class='ex'>3√5 + 2√5 − √5 = 4√5<br>√75 − √12 + √27 = 5√3 − 2√3 + 3√3 = 6√3<br>√2 + √3 cannot be combined.</div><h3>4. Multiplying and dividing surds</h3><p>m√a × n√b = mn√(ab). When you expand brackets, multiply every term in the first bracket by every term in the second.</p><div class='ex'>2√3 × 4√6 = 8√18 = 8 × 3√2 = 24√2<br>(2 + √3)(4 − √3) = 8 − 2√3 + 4√3 − 3 = 5 + 2√3<br>√48 ÷ √3 = √16 = 4</div><p>Two results come up constantly: (√a)² = a, and (a + √b)(a − √b) = a² − b. The second one has no surd left in it.</p><h3>5. Rationalising the denominator</h3><p>This means rewriting a fraction so the bottom has no surd. If the bottom is a single surd, multiply top and bottom by that surd. If it has two terms, multiply by its <b>conjugate</b>, the same two terms with the sign changed in the middle.</p><div class='ex'>6 ÷ √3 = (6 × √3) ÷ (√3 × √3) = 6√3 ÷ 3 = 2√3<br>5 ÷ (3 − √2): multiply top and bottom by (3 + √2). The bottom becomes 9 − 2 = 7, so the answer is (15 + 5√2) ÷ 7.</div><h3>6. Using surds in problems</h3><p>Leave answers in surd form when the question asks for an exact value. The diagonal of a 3 m by 5 m rectangle is √(9 + 25) = √34 m.</p><p>You may also be asked to find unknowns. If (3 + √2)² = a + b√2, expand to get 9 + 6√2 + 2 = 11 + 6√2. The rational parts match and the surd parts match, so a = 11 and b = 6.</p><h3>Common mistakes</h3><ul><li>Writing √(a + b) = √a + √b. It is false: √(9 + 16) = 5, but √9 + √16 = 7.</li><li>Combining unlike surds, such as √2 + √3 = √5.</li><li>Multiplying only the top by the conjugate when rationalising. You must multiply both.</li><li>Stopping before the surd is fully simplified.</li></ul><p class='tip'>Exam tip: show each simplification step. Marks are usually given for the method, even if a calculation slips.</p>`],
["Indices and logarithms",[
[1,"Simplify 2³ × 2⁴.",["2¹²","2⁷","4⁷","2¹"],1,"Same base, so add the powers: 3 + 4 = 7."],
[2,"Evaluate log₂ 32.",["4","5","6","16"],1,"2⁵ = 32, so log₂ 32 = 5."],
[3,"Solve log₂ x + log₂ (x − 2) = 3.",["x = 4","x = −2","x = 4 or x = −2","x = 8"],0,"Combine: x(x − 2) = 8, so x² − 2x − 8 = 0 and x = 4 or −2. Logs need positive inputs, so x = −2 is rejected."]],
`<p>Index laws: aᵐ × aⁿ = aᵐ⁺ⁿ, aᵐ ÷ aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1 and a⁻ⁿ = 1 ÷ aⁿ.</p><p>A logarithm is a power: log_a b = x means aˣ = b. So log₂ 32 = 5 because 2⁵ = 32.</p><ul><li>log a + log b = log (ab)</li><li>log a − log b = log (a ÷ b)</li><li>log aⁿ = n log a</li></ul><p>When you solve a log equation, check that every answer keeps the number inside each log positive.</p><h3>1. The laws of indices in full</h3><ul><li>aᵐ × aⁿ = aᵐ⁺ⁿ and aᵐ ÷ aⁿ = aᵐ⁻ⁿ</li><li>(aᵐ)ⁿ = aᵐⁿ and (ab)ⁿ = aⁿbⁿ</li><li>a⁰ = 1 for any a that is not 0</li><li>a⁻ⁿ = 1 ÷ aⁿ</li><li>a^(1/n) is the nth root of a, and a^(m/n) = (nth root of a) to the power m</li></ul><div class='ex'><b>Examples.</b><br>8^(2/3) = (cube root of 8)² = 2² = 4<br>27^(−1/3) = 1 ÷ (cube root of 27) = 1/3<br>(2x³)² × 3x = 4x⁶ × 3x = 12x⁷</div><h3>2. Solving index equations</h3><p>Write both sides with the same base, then equate the powers.</p><div class='ex'>2^(x+1) = 32. Since 32 = 2⁵, x + 1 = 5, so x = 4.<br>4ˣ = 8. Write 4 = 2² and 8 = 2³, so 2^(2x) = 2³ and 2x = 3, giving x = 1.5.<br>3^(2x) = 81. Since 81 = 3⁴, 2x = 4, so x = 2.</div><h3>3. What a logarithm is</h3><p>log_a b = x means aˣ = b. The logarithm is the <b>power</b> you raise the base to. For example, log₃ 81 = 4 because 3⁴ = 81. Two values always hold: log_a 1 = 0 and log_a a = 1. A logarithm written without a base, log x, means base 10, so log 1000 = 3.</p><h3>4. The laws of logarithms</h3><ul><li>log a + log b = log (ab)</li><li>log a − log b = log (a ÷ b)</li><li>log aⁿ = n log a</li><li>Change of base: log_a b = log b ÷ log a</li></ul><div class='ex'>log 2 + log 5 = log 10 = 1<br>log 9 + log 4 − log 6 = log (36 ÷ 6) = log 6<br>log₂ 8 = log 8 ÷ log 2 = 3</div><h3>5. Solving logarithm equations</h3><div class='ex'><b>Type 1: one log.</b> log₅ (2x − 1) = 2 means 2x − 1 = 5² = 25, so x = 13.<br><b>Type 2: several logs.</b> Combine them into one log first, as in the worked quiz question, then convert to an index equation. Always reject any answer that makes a log input zero or negative.<br><b>Type 3: variable in the power.</b> 2ˣ = 7. Take logs of both sides: x log 2 = log 7, so x = 0.8451 ÷ 0.3010 ≈ 2.81.</div><h3>6. Real-life uses</h3><ul><li><b>Compound interest:</b> A = P(1 + r ÷ 100)ⁿ. GH₵2,000 at 10% a year for 3 years becomes 2,000 × 1.1³ = GH₵2,662.</li><li><b>Doubling time:</b> at 10% a year, 1.1ⁿ = 2, so n = log 2 ÷ log 1.1 ≈ 7.3 years.</li><li><b>pH:</b> pH = −log [H⁺]. A concentration of 10⁻⁵ mol/L gives pH 5.</li><li><b>Sound:</b> an increase of 20 decibels means the intensity is multiplied by 100.</li></ul><h3>Common mistakes</h3><ul><li>Writing log (a + b) = log a + log b. It is false.</li><li>Treating log a ÷ log b as log (a ÷ b). They are different things.</li><li>Forgetting to check answers in the original equation.</li></ul><p class='tip'>Exam tip: when you see a logarithm equation, your first move is to ask whether you can turn it into an index equation, because that is nearly always the quickest route.</p>`],
["Simultaneous equations",[
[1,"If x + y = 7 and x − y = 1, what are x and y?",["x = 3, y = 4","x = 4, y = 3","x = 5, y = 2","x = 6, y = 1"],1,"Add the equations: 2x = 8, so x = 4. Then y = 3."],
[2,"Solve 3x + 2y = 12 and x + y = 5.",["x = 2, y = 3","x = 3, y = 2","x = 4, y = 1","x = 1, y = 4"],0,"From the second, y = 5 − x. Substitute: 3x + 10 − 2x = 12, so x = 2 and y = 3."],
[3,"4 pens and 3 books cost GH₵41. 2 pens and 5 books cost GH₵45. What is the price of one book?",["GH₵5","GH₵6","GH₵7","GH₵9"],2,"Double the second equation: 4p + 10b = 90. Subtract the first: 7b = 49, so b = 7."]],
`<p>Two equations with two unknowns are solved together. There are three methods.</p><ul><li><b>Elimination:</b> make one variable’s coefficients match, then add or subtract. From x + y = 7 and x − y = 1, adding gives 2x = 8, so x = 4 and y = 3.</li><li><b>Substitution:</b> rearrange one equation (for example y = 5 − x) and put it into the other.</li><li><b>Graphical:</b> draw both lines. The solution is the point where they cross.</li></ul><p>For word problems, name the unknowns, write one equation for each fact, solve, then check in both equations.</p><h3>1. What simultaneous means</h3><p>One equation with two unknowns, such as x + y = 7, has endless solutions. Two equations that must both be true together usually have exactly one pair of values that works. That pair is the solution.</p><h3>2. Elimination method</h3><p>Make the coefficients of one variable the same size, then add or subtract to remove it. Use <b>subtract</b> when the signs match and <b>add</b> when the signs are opposite.</p><div class='ex'><b>Solve 3x + 2y = 16 and 5x − y = 5.</b><br>Multiply the second equation by 2: 10x − 2y = 10.<br>Add it to the first: 13x = 26, so x = 2.<br>Substitute into 5x − y = 5: 10 − y = 5, so y = 5.<br>Check in the other equation: 3(2) + 2(5) = 16 ✓</div><h3>3. Substitution method</h3><p>Make one variable the subject of one equation, then replace it in the other. This works best when one equation already has x or y on its own.</p><div class='ex'><b>Solve 2x + y = 11 and y = x − 1.</b><br>Replace y: 2x + (x − 1) = 11, so 3x = 12 and x = 4.<br>Then y = 4 − 1 = 3. Check: 2(4) + 3 = 11 ✓</div><h3>4. Graphical method</h3><p>Rewrite each equation as y = mx + c, find two or more points on each line, and draw both on the same axes. The point where the lines cross is the solution.</p><div class='ex'><b>x + y = 4 and y = 2x − 2.</b><br>Points on x + y = 4: (0, 4) and (4, 0).<br>Points on y = 2x − 2: (0, −2) and (1, 0).<br>The lines cross at (2, 2), so x = 2 and y = 2.</div><p>Two special cases: parallel lines (such as y = 2x + 1 and y = 2x + 5) never meet, so there is <b>no solution</b>. If both equations describe the same line (x + y = 3 and 2x + 2y = 6), there are <b>infinitely many solutions</b>.</p><h3>5. Word problems</h3><p>Follow five steps: read carefully, define the unknowns, write one equation for each fact, solve, then check the answer makes sense.</p><div class='ex'><b>Ama is 4 years older than Kofi. In 6 years the sum of their ages will be 38. Find their ages now.</b><br>Let Ama be A and Kofi be K. Then A = K + 4.<br>In 6 years: (A + 6) + (K + 6) = 38, so A + K = 26.<br>Substitute: K + 4 + K = 26, so K = 11 and A = 15.<br>Check: in 6 years they will be 21 and 17, and 21 + 17 = 38 ✓</div><h3>6. One linear and one quadratic equation</h3><p>These appear often in WASSCE. Substitute the linear equation into the quadratic one, solve, then find both y values.</p><div class='ex'><b>Solve y = x + 1 and y = x² − 5.</b><br>x + 1 = x² − 5, so x² − x − 6 = 0, which factorises as (x − 3)(x + 2) = 0.<br>x = 3 gives y = 4, and x = −2 gives y = −1.<br>The solutions are (3, 4) and (−2, −1).</div><h3>Common mistakes</h3><ul><li>Sign errors when subtracting a whole equation. Take extra care with negative terms.</li><li>Finding x and forgetting to find y.</li><li>Not checking the answer in both original equations.</li><li>In the quadratic case, giving only one of the two solution pairs.</li></ul><p class='tip'>Exam tip: pick elimination when both equations are in the form ax + by = c, and pick substitution when one variable is already isolated.</p>`],
["Modular arithmetic",[
[1,"What is 17 mod 5?",["1","2","3","4"],1,"17 = 3 × 5 + 2, so the remainder is 2."],
[2,"It is 08:00 on a 24-hour clock. What time is it 100 hours later?",["04:00","08:00","12:00","16:00"],2,"100 mod 24 = 4, so add 4 hours: 12:00."],
[3,"What is the smallest positive n with 2ⁿ ≡ 1 (mod 7)?",["2","3","4","6"],1,"2¹ = 2, 2² = 4, 2³ = 8 and 8 leaves remainder 1 when divided by 7."]],
`<p>Modular arithmetic works with remainders. a mod m is the remainder when a is divided by m, so 17 mod 5 = 2. We write a ≡ b (mod m) when a and b leave the same remainder.</p><ul><li>Add or multiply first, then reduce: (9 + 7) mod 5 = 16 mod 5 = 1.</li><li>A clock is arithmetic mod 12, and a 24-hour clock is mod 24.</li><li>For negative numbers, add the modulus until you get a value from 0 to m − 1.</li></ul><h3>1. Division with a remainder</h3><p>Any integer a can be written a = qm + r, where m is the modulus, q is the quotient and the remainder r satisfies 0 ≤ r &lt; m. Since 47 = 5 × 9 + 2, we have 47 mod 9 = 2.</p><h3>2. Congruence</h3><p>a ≡ b (mod m) means m divides a − b exactly, which is the same as saying a and b leave the same remainder. So 23 ≡ 8 (mod 5), because 23 − 8 = 15. Working mod 3 splits all integers into three groups (called residue classes): {…, −3, 0, 3, 6, …}, {…, −2, 1, 4, 7, …} and {…, −1, 2, 5, 8, …}.</p><div class='ex'>Negative numbers: −8 mod 3. Since −8 = 3 × (−3) + 1, the answer is 1.</div><h3>3. Adding, subtracting and multiplying</h3><p>You can reduce before or after an operation and get the same result.</p><div class='ex'>(23 + 19) mod 7 = 42 mod 7 = 0<br>(9 × 8) mod 5 = 72 mod 5 = 2<br>Faster: 9 ≡ 4 and 8 ≡ 3 (mod 5), so 9 × 8 ≡ 4 × 3 = 12 ≡ 2 (mod 5)</div><h3>4. Powers</h3><p>Look for a pattern that repeats.</p><div class='ex'>2¹⁰ mod 7: 2³ = 8 ≡ 1, so 2¹⁰ = (2³)³ × 2 ≡ 1 × 2 = 2.<br>7¹⁰⁰ mod 10: the last digits of the powers of 7 repeat 7, 9, 3, 1. Since 100 is a multiple of 4, the last digit is 1.</div><h3>5. Solving linear congruences</h3><p>To solve ax ≡ b (mod m), find the <b>inverse</b> of a, the number that multiplies with a to give 1 (mod m). An inverse exists only when a and m share no common factor other than 1.</p><div class='ex'>3x ≡ 4 (mod 7). Since 3 × 5 = 15 ≡ 1, the inverse of 3 is 5. Multiply both sides by 5: x ≡ 20 ≡ 6 (mod 7). Check: 3 × 6 = 18, and 18 mod 7 = 4 ✓</div><h3>6. Divisibility checks</h3><ul><li>A number mod 2, 5 or 10 depends on its last digit.</li><li>A number mod 3 or 9 equals its digit sum mod 3 or 9. For 123456789 the digit sum is 45, so it leaves remainder 0 mod 9.</li></ul><h3>7. Everyday uses</h3><ul><li><b>Clocks:</b> 100 hours after 08:00 is 100 mod 24 = 4 hours later, so 12:00.</li><li><b>Days of the week:</b> 100 days after a Tuesday is 100 mod 7 = 2 days later, which is Thursday.</li><li><b>Check digits and codes:</b> barcodes and ISBNs use a remainder to catch typing mistakes.</li><li><b>Cryptography:</b> secure online payments rely on modular arithmetic with very large numbers.</li></ul><h3>8. Properties</h3><p>Addition and multiplication mod m are both commutative and associative. The identity for addition is 0, and for multiplication it is 1. Every number has an additive inverse (the inverse of a is m − a), but not every number has a multiplicative inverse.</p><h3>Common mistakes</h3><ul><li>Giving a negative remainder. The remainder must be from 0 to m − 1.</li><li>Dividing both sides of a congruence by a number without checking it has an inverse.</li><li>Reducing the exponent mod m in a power question. The cycle length, not m, controls the exponent.</li></ul><p class='tip'>Exam tip: reduce numbers early. Working with small remainders keeps the arithmetic simple and avoids mistakes.</p>`],
["Transformations",[
[1,"Translate the point (2, 3) by the vector (4, −1). What is the image?",["(6, 2)","(−2, 4)","(6, 4)","(−2, 2)"],0,"Add the vector: (2 + 4, 3 − 1) = (6, 2)."],
[2,"What is the image of (3, −2) after reflection in the x-axis?",["(−3, −2)","(3, 2)","(−3, 2)","(−2, 3)"],1,"Reflection in the x-axis changes the sign of y: (x, y) → (x, −y)."],
[3,"What is the image of (4, 1) after reflection in the line x = 2?",["(0, 1)","(−4, 1)","(2, 1)","(4, 3)"],0,"The rule is (x, y) → (2a − x, y) with a = 2: (4 − 4, 1) = (0, 1)."]],
`<p>A transformation moves a shape to a new position, called the image.</p><ul><li><b>Translation:</b> slide by a vector. (x, y) → (x + a, y + b).</li><li><b>Reflection:</b> x-axis (x, y) → (x, −y); y-axis (x, y) → (−x, y); line y = x (x, y) → (y, x); line x = a (x, y) → (2a − x, y).</li><li><b>Rotation:</b> turn about a point. 90° anticlockwise about the origin: (x, y) → (−y, x).</li><li><b>Enlargement:</b> scale factor k from a centre. Every distance from the centre is multiplied by k.</li></ul><p>Translations, reflections and rotations keep the size and shape the same. Enlargements change the size.</p><h3>1. Key ideas</h3><p>The original shape is the <b>object</b> and the new shape is the <b>image</b>. Translations, reflections and rotations produce images that are <b>congruent</b> to the object (same size and shape). An enlargement produces an image that is <b>similar</b> (same shape, different size).</p><h3>2. Translation</h3><p>A translation slides every point by the same vector (a, b), moving it a units across and b units up. The rule is (x, y) → (x + a, y + b).</p><div class='ex'>Triangle A(1, 1), B(3, 1), C(2, 4) translated by (3, −2): A′(4, −1), B′(6, −1), C′(5, 2).<br>To find the vector, subtract: A(2, 5) → A′(−1, 3) uses (−1 − 2, 3 − 5) = (−3, −2).<br>The reverse translation uses the negative vector.</div><h3>3. Reflection</h3><p>Each point and its image are the same distance from the mirror line, and the line joining them is perpendicular to the mirror. Points on the mirror line do not move.</p><ul><li>x-axis: (x, y) → (x, −y)</li><li>y-axis: (x, y) → (−x, y)</li><li>y = x: (x, y) → (y, x)</li><li>y = −x: (x, y) → (−y, −x)</li><li>x = a: (x, y) → (2a − x, y)</li><li>y = b: (x, y) → (x, 2b − y)</li></ul><div class='ex'>Reflect (5, −2): in y = x gives (−2, 5); in y = −x gives (2, −5); in x = 1 gives (−3, −2); in y = 3 gives (5, 8).</div><p>To describe a reflection, you must state the equation of the mirror line.</p><h3>4. Rotation</h3><p>A rotation needs three things: the <b>centre</b>, the <b>angle</b> and the <b>direction</b> (clockwise or anticlockwise). About the origin:</p><ul><li>90° anticlockwise: (x, y) → (−y, x)</li><li>180°: (x, y) → (−x, −y)</li><li>90° clockwise: (x, y) → (y, −x)</li></ul><div class='ex'>Rotate (3, 2): 90° anticlockwise gives (−2, 3); 180° gives (−3, −2); 90° clockwise gives (2, −3).</div><p><b>Rotational symmetry:</b> the order is how many times a shape fits onto itself in a full turn. A square has order 4, an equilateral triangle 3, and a rectangle 2.</p><h3>5. Enlargement</h3><p>An enlargement has a <b>centre</b> and a <b>scale factor k</b>. Every distance from the centre is multiplied by k. About the origin, (x, y) → (kx, ky). If k is between 0 and 1 the image is smaller, and if k is negative the image is on the opposite side of the centre and upside down.</p><div class='ex'>Triangle (1, 2), (3, 2), (1, 5) enlarged by k = 2 about the origin: (2, 4), (6, 4), (2, 10).<br>Scale factor = image length ÷ object length. A side of 4 cm becoming 10 cm gives k = 2.5.<br>Lengths scale by k, areas by k² and volumes by k³. An area of 20 cm² becomes 20 × 6.25 = 125 cm².</div><h3>6. Combined transformations</h3><p>Do the transformations one at a time, in the order given. The order can change the answer.</p><div class='ex'>Reflect (3, 4) in the x-axis, then translate by (2, 1): (3, 4) → (3, −4) → (5, −3).</div><h3>Common mistakes</h3><ul><li>Describing a reflection without stating the mirror line, or a rotation without the centre.</li><li>Mixing up clockwise and anticlockwise.</li><li>Using the scale factor on areas instead of its square.</li></ul><p class='tip'>Exam tip: when you describe a transformation, name its type and every detail it needs: vector for translation, mirror line for reflection, centre, angle and direction for rotation, centre and scale factor for enlargement.</p>`],
["Statistics",[
[1,"Find the mean of 2, 4, 6 and 8.",["4","5","6","20"],1,"Total = 20, and 20 ÷ 4 = 5."],
[2,"Find the median of 3, 9, 4, 7 and 5.",["4","5","6","7"],1,"In order: 3, 4, 5, 7, 9. The middle value is 5."],
[3,"The mean of 5 numbers is 8. A sixth number is added and the mean becomes 9. What is the sixth number?",["9","12","14","17"],2,"The first total is 5 × 8 = 40. The new total is 6 × 9 = 54. The sixth number is 54 − 40 = 14."]],
`<p>Statistics describes data with a typical value and a measure of spread.</p><ul><li><b>Mean</b> = total ÷ number of values.</li><li><b>Median</b> = middle value once the data is in order. With two middle values, take their mean.</li><li><b>Mode</b> = most frequent value.</li><li><b>Range</b> = largest − smallest. The standard deviation is a more detailed measure of how far values spread from the mean.</li></ul><p>Present data with bar charts, pie charts, histograms and frequency tables.</p><h3>1. Types of data and collecting it</h3><p><b>Discrete</b> data is counted (number of students). <b>Continuous</b> data is measured (height, time). <b>Qualitative</b> data describes a quality (favourite colour). Common collection methods are questionnaires, interviews and observation. A sample should be chosen fairly so that it represents the whole group.</p><h3>2. Mean, median and mode from a frequency table</h3><div class='ex'>Scores 1, 2, 3, 4 with frequencies 2, 3, 4, 1.<br>Σf = 10 and Σfx = 2 + 6 + 12 + 4 = 24, so the mean = 24 ÷ 10 = 2.4.<br>The median is the (10 + 1) ÷ 2 = 5.5th value. The running totals are 2, 5, 9, 10, so the 5th value is 2 and the 6th is 3. The median is 2.5.<br>The mode is the score with the highest frequency: 3.</div><h3>3. Grouped data</h3><p>Use the class midpoint to stand for each class. The modal class is the one with the highest frequency.</p><div class='ex'>Classes 0–9, 10–19, 20–29 with frequencies 3, 5, 2. Midpoints are 4.5, 14.5 and 24.5.<br>Σfx = 13.5 + 72.5 + 49 = 135, and Σf = 10, so the mean = 13.5. The modal class is 10–19.</div><h3>4. Cumulative frequency</h3><p>Add up the frequencies as you go, then plot each running total against the upper class boundary. Join the points to make an <b>ogive</b>. Read the median at n ÷ 2, the lower quartile Q₁ at n ÷ 4 and the upper quartile Q₃ at 3n ÷ 4. The <b>interquartile range</b> is Q₃ − Q₁.</p><h3>5. Measures of spread</h3><p>The <b>range</b> is the largest value minus the smallest. The <b>standard deviation</b> shows how far values typically sit from the mean: take each deviation from the mean, square it, average the squares (the variance), then take the square root.</p><div class='ex'>Data: 2, 4, 6, 8. The mean is 5, the deviations are −3, −1, 1, 3, and the squares total 9 + 1 + 1 + 9 = 20.<br>Variance = 20 ÷ 4 = 5, so the standard deviation = √5 ≈ 2.24.</div><p>A larger standard deviation means the data is more spread out.</p><h3>6. Drawing charts</h3><ul><li><b>Bar chart:</b> separate bars with gaps, for discrete or qualitative data.</li><li><b>Histogram:</b> touching bars for continuous grouped data. The area shows the frequency.</li><li><b>Pie chart:</b> angle = (frequency ÷ total) × 360°. If 30 of 120 students chose football, the angle is 30 ÷ 120 × 360 = 90°.</li></ul><h3>Common mistakes</h3><ul><li>Dividing Σfx by the number of classes instead of by Σf.</li><li>Finding the median without putting the data in order first.</li><li>Reading the median from the wrong position on an ogive.</li></ul><p class='tip'>Exam tip: for any frequency table question, add columns for fx and cumulative frequency straight away. Most of the answers come from those two columns.</p>`],
["Ratios, rates and proportion",[
[1,"Share GH₵60 in the ratio 1 : 2. What is the larger share?",["GH₵20","GH₵30","GH₵40","GH₵45"],2,"There are 3 parts, so 1 part is 20. The larger share is 2 × 20 = GH₵40."],
[2,"A car travels 150 km in 2.5 hours. What is its average speed?",["50 km/h","60 km/h","65 km/h","375 km/h"],1,"Speed = 150 ÷ 2.5 = 60 km/h."],
[3,"5 workers build a wall in 12 days. How many days would 3 workers take at the same rate?",["7.2 days","15 days","20 days","36 days"],2,"This is inverse proportion. 5 × 12 = 60 worker-days, and 60 ÷ 3 = 20 days."]],
`<p>A <b>ratio</b> compares quantities of the same kind (1 : 2). A <b>rate</b> compares different units (km per hour).</p><ul><li><b>Direct proportion:</b> if one quantity doubles, so does the other.</li><li><b>Inverse proportion:</b> if one doubles, the other halves. The product stays the same.</li><li><b>Simple interest:</b> I = P × R × T ÷ 100, where P is the principal, R is the rate per year and T is the time in years.</li></ul><h3>1. Working with ratios</h3><p>A ratio compares quantities of the same kind. Simplify by dividing both parts by their highest common factor: 12 : 18 = 2 : 3. To combine ratios, make the shared quantity match. If a : b = 2 : 3 and b : c = 4 : 5, multiply the first by 4 and the second by 3 to get a : b : c = 8 : 12 : 15.</p><h3>2. Sharing in a ratio</h3><div class='ex'>Share GH₵840 in the ratio 3 : 4 : 5. The total is 12 parts, so one part is 70, giving GH₵210, GH₵280 and GH₵350.<br>If boys to girls is 3 : 5 and there are 48 students, one part is 6, so there are 18 boys and 30 girls.<br>If the ratio is 2 : 3 and the smaller amount is GH₵50, one part is 25, so the larger amount is GH₵75.</div><h3>3. Rates</h3><p>A rate compares different units. Common ones are speed (km/h), fuel use (km per litre), unit price and exchange rates.</p><div class='ex'>5 kg of rice for GH₵42.50 is GH₵8.50 per kg.<br>Exchange rate example: if US$1 = GH₵12 (an illustrative rate, not the current one), then US$250 = 250 × 12 = GH₵3,000.</div><h3>4. Direct and inverse proportion</h3><p>In <b>direct</b> proportion y = kx, so y ÷ x stays constant. Use the unitary method: if 8 books cost GH₵96, one book costs 12, so 5 books cost GH₵60.</p><p>In <b>inverse</b> proportion xy stays constant. If 6 workers need 15 days, that is 90 worker-days, so 9 workers need 90 ÷ 9 = 10 days.</p><h3>5. Distance–time graphs</h3><ul><li>The <b>gradient</b> is the speed. A steeper line means faster.</li><li>A horizontal line means the object is stationary.</li><li>A line sloping down means the object is returning.</li></ul><p><b>Average speed</b> = total distance ÷ total time. It is not the average of the speeds. If you drive 60 km at 30 km/h (2 hours) and 60 km at 60 km/h (1 hour), the total is 120 km in 3 hours, so the average is 40 km/h, not 45.</p><h3>6. Financial mathematics</h3><ul><li><b>Discount:</b> 20% off GH₵250 is 250 × 0.8 = GH₵200.</li><li><b>Commission:</b> 5% on sales of GH₵12,000 is GH₵600.</li><li><b>Tax:</b> a 15% tax on GH₵200 gives 200 × 1.15 = GH₵230.</li><li><b>Hire purchase:</b> a deposit of GH₵300 plus 6 payments of GH₵120 costs 300 + 720 = GH₵1,020 in total.</li></ul><h3>Common mistakes</h3><ul><li>Averaging two speeds instead of dividing total distance by total time.</li><li>Writing a ratio in the wrong order.</li><li>Mixing units, such as minutes and hours, in a rate.</li><li>Using direct proportion where the situation is inverse (more workers means fewer days).</li></ul><p class='tip'>Exam tip: before choosing a method, ask whether more of one quantity means more or less of the other. That tells you whether it is direct or inverse.</p>`],
["Sequences and series",[
[1,"What is the next term in 3, 7, 11, 15, …?",["17","18","19","21"],2,"The common difference is 4, so the next term is 15 + 4 = 19."],
[2,"An arithmetic sequence has first term 5 and common difference 3. What is the 10th term?",["30","32","35","38"],1,"Tₙ = a + (n − 1)d = 5 + 9 × 3 = 32."],
[3,"Find the sum of the first 10 terms of an arithmetic series with a = 2 and d = 3.",["155","145","310","32"],0,"Sₙ = n ÷ 2 × (2a + (n − 1)d) = 5 × (4 + 27) = 155."]],
`<p>A <b>sequence</b> is a list of numbers that follow a rule. A <b>series</b> is the sum of the terms.</p><ul><li><b>Arithmetic (AP):</b> add the same difference d each time. Tₙ = a + (n − 1)d and Sₙ = n ÷ 2 × (2a + (n − 1)d).</li><li><b>Geometric (GP):</b> multiply by the same ratio r each time. Tₙ = a rⁿ⁻¹.</li></ul><p>To tell them apart, check whether the gap between terms is constant (AP) or the ratio is constant (GP).</p><h3>1. Finding the nth term of a pattern</h3><p>If the gap between terms is a constant d, the nth term is dn + (a − d), where a is the first term. For 5, 8, 11, 14: d = 3 and a − d = 2, so Tₙ = 3n + 2. Check: T₄ = 14 ✓</p><h3>2. Arithmetic progression (AP)</h3><p>Tₙ = a + (n − 1)d.</p><div class='ex'><b>T₃ = 11 and T₇ = 23. Find a and d.</b><br>T₇ − T₃ = 4d = 12, so d = 3. Then a + 2(3) = 11, so a = 5.<br><b>How many terms in 4, 7, 10, …, 100?</b><br>4 + (n − 1)3 = 100, so n − 1 = 32 and n = 33.</div><h3>3. Sum of an AP</h3><p>Sₙ = n ÷ 2 × (2a + (n − 1)d), or Sₙ = n ÷ 2 × (first + last).</p><div class='ex'>First 20 terms of 4, 7, 10, …: S₂₀ = 10 × (8 + 57) = 650<br>1 + 2 + 3 + … + 100 = 100 ÷ 2 × (1 + 100) = 5,050</div><h3>4. Geometric progression (GP)</h3><p>Tₙ = a rⁿ⁻¹, where r is the common ratio.</p><div class='ex'>3, 6, 12, … has r = 2, so T₈ = 3 × 2⁷ = 384.<br>If T₂ = 6 and T₅ = 48, then r³ = 8, so r = 2 and a = 3.</div><p>Sum of n terms: Sₙ = a(rⁿ − 1) ÷ (r − 1) when r &gt; 1, or a(1 − rⁿ) ÷ (1 − r) when r &lt; 1. For 3, 6, 12, …, S₆ = 3 × (64 − 1) ÷ 1 = 189.</p><p>If −1 &lt; r &lt; 1, the terms shrink and the series has a <b>sum to infinity</b>: S∞ = a ÷ (1 − r). For 8 + 4 + 2 + …, S∞ = 8 ÷ 0.5 = 16.</p><h3>5. Real-life problems</h3><ul><li><b>Salary (AP):</b> a worker starts on GH₵2,000 and gets GH₵150 more each year. In year 8 the pay is 2,000 + 7 × 150 = GH₵3,050. Total over 8 years = 4 × (2,000 + 3,050) = GH₵20,200.</li><li><b>Depreciation (GP):</b> a GH₵50,000 car loses 10% a year, so after 3 years it is worth 50,000 × 0.9³ = GH₵36,450.</li></ul><h3>Common mistakes</h3><ul><li>Using n instead of n − 1 in the nth-term formulas.</li><li>Mixing up the AP and GP formulas. Check whether you add or multiply to get from one term to the next.</li><li>Confusing a term (Tₙ) with a sum (Sₙ).</li></ul><p class='tip'>Exam tip: with two terms given, subtract (AP) or divide (GP) to get d or r first.</p>`],
["Surface area and volume",[
[1,"Find the volume of a cuboid measuring 5 cm by 4 cm by 3 cm.",["12 cm³","47 cm³","60 cm³","120 cm³"],2,"Volume = length × width × height = 5 × 4 × 3 = 60 cm³."],
[2,"Find the volume of a cylinder of radius 7 cm and height 10 cm. (Use π = 22/7.)",["440 cm³","1,540 cm³","3,080 cm³","4,620 cm³"],1,"V = πr²h = 22/7 × 49 × 10 = 1,540 cm³."],
[3,"A cylindrical tank has radius 7 m and height 5 m. How many litres does it hold when full? (π = 22/7, 1 m³ = 1,000 litres.)",["770 L","7,700 L","77,000 L","770,000 L"],3,"V = 22/7 × 49 × 5 = 770 m³. Then 770 × 1,000 = 770,000 litres."]],
`<p>Surface area is the total area of the outside faces. Volume is the space inside.</p><ul><li><b>Cuboid:</b> V = lwh and surface area = 2(lw + lh + wh).</li><li><b>Cylinder:</b> V = πr²h and curved surface = 2πrh.</li><li><b>Cone:</b> V = ⅓πr²h and curved surface = πrl, where l is the slant height.</li><li><b>Sphere:</b> V = 4⁄3 πr³.</li></ul><p>Convert units before you calculate: 1 m³ = 1,000 litres and 1 litre = 1,000 cm³.</p><h3>1. Formulas to learn</h3><ul><li><b>Cuboid:</b> V = lwh, surface area = 2(lw + lh + wh).</li><li><b>Prism:</b> V = area of cross-section × length.</li><li><b>Cylinder:</b> V = πr²h, curved surface = 2πrh, total surface = 2πr(r + h).</li><li><b>Cone:</b> V = ⅓πr²h, curved surface = πrl, where l = √(r² + h²).</li><li><b>Pyramid:</b> V = ⅓ × base area × h.</li><li><b>Sphere:</b> V = 4/3 πr³, surface area = 4πr².</li></ul><h3>2. Cuboids and cylinders</h3><div class='ex'>A 8 cm × 5 cm × 3 cm box has V = 120 cm³ and surface area = 2(40 + 24 + 15) = 158 cm².<br>A closed cylinder with r = 7 cm and h = 10 cm (π = 22/7): total surface = 2 × 22/7 × 7 × 17 = 748 cm².</div><h3>3. Cones and pyramids</h3><p>The slant height l is the sloping side, not the vertical height. Use Pythagoras to find it.</p><div class='ex'>A cone has r = 6 cm and h = 8 cm. Then l = √(36 + 64) = 10 cm.<br>Curved surface = π × 6 × 10 = 60π ≈ 188.5 cm².<br>Volume = ⅓ × π × 36 × 8 = 96π ≈ 301.6 cm³.<br>A square pyramid with base 6 cm and height 4 cm has V = ⅓ × 36 × 4 = 48 cm³.</div><h3>4. Spheres</h3><div class='ex'>For r = 6 cm: V = 4/3 π × 216 = 288π ≈ 904.8 cm³, and surface area = 4π × 36 = 144π ≈ 452.4 cm².<br>A hemisphere is half a sphere: V = 2/3 πr³, and its curved surface is 2πr².</div><h3>5. Composite solids</h3><p>Split the shape into simple solids, work out each part, then add the volumes. For surface area, only count the faces you can see from outside.</p><div class='ex'>A silo is a cylinder (r = 2 m, h = 5 m) with a hemisphere on top.<br>V = π × 4 × 5 + 2/3 π × 8 = 20π + 16π/3 = 76π/3 ≈ 79.6 m³.</div><h3>6. Units and capacity</h3><p>Make all lengths the same unit before you calculate. 1 m = 100 cm, so 1 m³ = 1,000,000 cm³. A tank 2 m by 1.5 m by 1 m has V = 3 m³ = 3,000 litres.</p><h3>7. Similar solids</h3><p>If lengths are multiplied by a scale factor k, areas are multiplied by k² and volumes by k³. Doubling every length makes the surface area 4 times larger and the volume 8 times larger.</p><h3>Common mistakes</h3><ul><li>Using the diameter in a formula that needs the radius.</li><li>Mixing units, such as cm and m, in the same calculation.</li><li>Using the vertical height instead of the slant height in curved surface formulas.</li><li>Forgetting the ⅓ in cone and pyramid volumes.</li></ul><p class='tip'>Exam tip: write the formula first, then substitute the numbers. It earns method marks even if the arithmetic slips.</p>`],
["Probability",[
[1,"A fair die is rolled. What is the probability of an even number?",["1/6","1/3","1/2","2/3"],2,"Even numbers are 2, 4 and 6, which is 3 of 6 outcomes."],
[2,"A bag has 3 red and 5 blue balls. One ball is picked at random. What is P(red)?",["3/5","3/8","5/8","1/3"],1,"There are 3 red balls out of 8 in total."],
[3,"Two fair coins are tossed. What is the probability of at least one head?",["1/4","1/2","3/4","1"],2,"The outcomes are HH, HT, TH and TT. Three of four contain a head."]],
`<p>Probability measures how likely an event is, from 0 (impossible) to 1 (certain).</p><p><b>P(event) = number of favourable outcomes ÷ total number of outcomes.</b></p><ul><li>P(not A) = 1 − P(A).</li><li><b>Independent events:</b> P(A and B) = P(A) × P(B).</li><li><b>Mutually exclusive events:</b> P(A or B) = P(A) + P(B).</li></ul><p>For two-step experiments, list the outcomes or draw a tree diagram.</p><h3>1. Key terms</h3><p>An <b>experiment</b> is any action with an uncertain result, such as rolling a die. Each possible result is an <b>outcome</b>. The <b>sample space</b> S is the set of all outcomes, and an <b>event</b> is any group of outcomes you are interested in. For a die, S = {1, 2, 3, 4, 5, 6}, so n(S) = 6.</p><h3>2. Basic probability</h3><p>When outcomes are equally likely, P(E) = n(E) ÷ n(S). Probabilities are always between 0 and 1.</p><div class='ex'>P(prime on a die) = 3 ÷ 6 = 1/2, because the primes are 2, 3 and 5.<br>P(multiple of 3) = 2 ÷ 6 = 1/3.<br>In a pack of 52 cards: P(king) = 4/52 = 1/13, P(heart) = 13/52 = 1/4, P(red king) = 2/52 = 1/26.</div><h3>3. Complements and ‘at least one’</h3><p>P(not A) = 1 − P(A). For ‘at least one’ questions, work out the probability of <b>none</b> and subtract from 1. In 3 coin tosses, P(no heads) = 1/8, so P(at least one head) = 1 − 1/8 = 7/8.</p><h3>4. The OR rule</h3><p>If two events cannot happen together (mutually exclusive), P(A or B) = P(A) + P(B). If they can overlap, subtract the overlap: P(A or B) = P(A) + P(B) − P(A and B).</p><div class='ex'>P(heart or king) = 13/52 + 4/52 − 1/52 = 16/52 = 4/13. The king of hearts is counted twice, so we remove it once.</div><h3>5. The AND rule for independent events</h3><p>Events are independent when one does not affect the other. Then P(A and B) = P(A) × P(B). When you toss a coin and roll a die, P(head and a 6) = 1/2 × 1/6 = 1/12.</p><h3>6. With and without replacement</h3><p>A bag holds 4 red and 6 blue balls. Two balls are drawn.</p><div class='ex'><b>With replacement</b> (the ball goes back): P(both red) = 4/10 × 4/10 = 4/25.<br><b>Without replacement</b>: the second draw has one fewer ball, so P(both red) = 4/10 × 3/9 = 12/90 = 2/15.<br>P(one of each colour) = P(red then blue) + P(blue then red) = 24/90 + 24/90 = 48/90 = 8/15.<br>Check: RR 12/90 + BB 30/90 + mixed 48/90 = 90/90 ✓</div><h3>7. Tree diagrams</h3><p>Draw a branch for each outcome at each stage and write the probability on it. <b>Multiply</b> along a path to get the probability of that whole sequence, and <b>add</b> the paths that give the event you want. The final probabilities must total 1.</p><h3>8. Relative frequency and expected number</h3><p>Relative frequency = number of times the event happened ÷ number of trials. Expected number = probability × number of trials. If P(rain) = 0.3 on any day, you expect rain on 0.3 × 50 = 15 days out of 50.</p><h3>Common mistakes</h3><ul><li>Adding when you should multiply. AND usually means multiply, OR usually means add.</li><li>Forgetting the denominator drops by one when there is no replacement.</li><li>Giving a probability above 1 or below 0. That signals an error.</li></ul><p class='tip'>Exam tip: always check by adding all the outcomes of your tree diagram. The total must be exactly 1.</p>`],
["Vectors and trigonometry",[
[1,"What is sin 30°?",["1/2","√3/2","1","√2/2"],0,"sin 30° = 1/2 is a standard value."],
[2,"In a right-angled triangle, the side opposite angle θ is 6 and the side adjacent is 8. What is tan θ?",["3/4","4/3","3/5","4/5"],0,"tan θ = opposite ÷ adjacent = 6/8 = 3/4."],
[3,"Given a = (2, 3) and b = (−1, 4), find a + 2b.",["(0, 11)","(1, 7)","(0, 10)","(3, 11)"],0,"2b = (−2, 8). Then a + 2b = (2 − 2, 3 + 8) = (0, 11)."]],
`<p><b>Trigonometric ratios</b> in a right-angled triangle: sin θ = opposite ÷ hypotenuse, cos θ = adjacent ÷ hypotenuse and tan θ = opposite ÷ adjacent (SOH CAH TOA).</p><p>Standard values: sin 30° = 1/2, cos 60° = 1/2, tan 45° = 1.</p><p>A <b>vector</b> has size and direction, written as a column (x, y). Add vectors by adding their components. A scalar multiple k × (x, y) = (kx, ky). The magnitude is √(x² + y²).</p><h3>1. Naming the sides</h3><p>In a right-angled triangle, the <b>hypotenuse</b> is opposite the right angle. The <b>opposite</b> side faces the angle θ you are working with, and the <b>adjacent</b> side touches θ. The names change if you switch to the other angle.</p><p>SOH CAH TOA: sin θ = O ÷ H, cos θ = A ÷ H, tan θ = O ÷ A. Learn the exact values: sin 30° = 1/2, cos 30° = √3/2, tan 30° = 1/√3; sin 45° = cos 45° = √2/2, tan 45° = 1; sin 60° = √3/2, cos 60° = 1/2, tan 60° = √3.</p><h3>2. Finding sides and angles</h3><div class='ex'><b>Find a side.</b> A triangle has hypotenuse 12 cm and angle 35°. The opposite side = 12 × sin 35° = 12 × 0.5736 = 6.88 cm.<br><b>Find an angle.</b> Opposite = 5 and hypotenuse = 13. sin θ = 5/13 = 0.3846, so θ = sin⁻¹(0.3846) = 22.6°.</div><h3>3. Elevation and depression</h3><p>The <b>angle of elevation</b> is measured upward from the horizontal, and the <b>angle of depression</b> downward from the horizontal. The two are equal for the same line of sight.</p><div class='ex'>A boy stands 50 m from the foot of a tower. The angle of elevation of the top is 40°. Height = 50 × tan 40° = 50 × 0.8391 ≈ 42.0 m. Add the boy’s eye height if the question gives it.</div><h3>4. Bearings</h3><p>A bearing is an angle measured <b>clockwise from north</b>, always written with three digits (045°, 270°). To find the back bearing, add or subtract 180°. If the bearing of B from A is 060°, the bearing of A from B is 240°.</p><h3>5. Triangles without a right angle</h3><ul><li><b>Sine rule:</b> a ÷ sin A = b ÷ sin B. Use it when you know a side and its opposite angle.</li><li><b>Cosine rule:</b> a² = b² + c² − 2bc cos A. Use it when you know two sides and the angle between them, or all three sides.</li><li><b>Area:</b> ½ ab sin C.</li></ul><div class='ex'>Two sides are 5 cm and 8 cm with a 60° angle between them. The third side squared = 25 + 64 − 2(5)(8)cos 60° = 89 − 40 = 49, so the side is 7 cm.<br>Sides 7 cm and 9 cm with a 50° angle between them: area = ½ × 7 × 9 × sin 50° = 31.5 × 0.7660 ≈ 24.1 cm².</div><h3>6. Vectors in more detail</h3><p>The vector from A to B is AB = B − A. For A(1, 2) and B(5, 5), AB = (4, 3) and its magnitude is √(16 + 9) = 5. Reversing the direction reverses the signs, so BA = (−4, −3).</p><ul><li><b>Parallel vectors:</b> one is a multiple of the other. (2, 3) and (6, 9) are parallel because 6 = 3 × 2 and 9 = 3 × 3.</li><li><b>Unit vector:</b> divide a vector by its magnitude. For (3, 4), the unit vector is (3/5, 4/5).</li><li><b>Midpoint:</b> OM = ½(OA + OB). For A(2, 6) and B(8, 2), M = (5, 4).</li></ul><h3>Common mistakes</h3><ul><li>Having the calculator in radians instead of degrees.</li><li>Labelling opposite and adjacent from the wrong angle.</li><li>Writing a bearing with fewer than three digits, or measuring it from east.</li><li>Mixing up AB and BA, which have opposite signs.</li></ul><p class='tip'>Exam tip: sketch the triangle and label O, A and H before choosing sin, cos or tan. Most errors come from skipping the sketch.</p>`],
["Sets",[
[1,"If A = {1, 2, 3} and B = {3, 4, 5}, what is A ∩ B?",["{1, 2, 3, 4, 5}","{3}","{1, 2}","∅"],1,"The intersection holds only the elements in both sets: {3}."],
[2,"In a class of 40, 25 offer Physics, 18 offer Chemistry and 8 offer both. How many offer neither?",["3","5","7","8"],1,"n(P ∪ C) = 25 + 18 − 8 = 35, so 40 − 35 = 5 offer neither."],
[3,"If n(A) = 12, n(B) = 9 and n(A ∪ B) = 17, what is n(A ∩ B)?",["3","4","5","8"],1,"n(A ∩ B) = n(A) + n(B) − n(A ∪ B) = 12 + 9 − 17 = 4."]],
`<h3>1. What a set is</h3><p>A set is a collection of well-defined objects called <b>elements</b>. We write sets in curly brackets: A = {2, 3, 5, 7}. The symbol ∈ means ‘belongs to’, so 3 ∈ A and 4 ∉ A. The number of elements is n(A). The <b>empty set</b> ∅ has no elements, and the <b>universal set</b> ξ contains everything under discussion.</p><p>You can describe a set by listing it or by a rule: {x : x is a prime number less than 10} = {2, 3, 5, 7}.</p><h3>2. Subsets</h3><p>B ⊂ A means every element of B is also in A. A set with n elements has 2ⁿ subsets in total, including ∅ and the set itself, and 2ⁿ − 1 proper subsets. {a, b, c} has 2³ = 8 subsets.</p><h3>3. Operations on sets</h3><ul><li><b>Union A ∪ B:</b> elements in A or B or both.</li><li><b>Intersection A ∩ B:</b> elements in both.</li><li><b>Complement A′:</b> elements of ξ that are not in A.</li><li><b>Difference A \ B:</b> elements in A but not in B.</li></ul><div class='ex'>ξ = {1, …, 10}, A = {2, 4, 6, 8, 10}, B = {1, 2, 3, 4, 5}.<br>A ∪ B = {1, 2, 3, 4, 5, 6, 8, 10}<br>A ∩ B = {2, 4}<br>A′ = {1, 3, 5, 7, 9}<br>(A ∪ B)′ = {7, 9}<br>A \ B = {6, 8, 10}</div><h3>4. Venn diagrams and counting</h3><p>Draw a rectangle for ξ and a circle for each set. <b>Always fill in the overlap first</b>, then subtract it from each set to get the ‘only’ regions.</p><p>For two sets: n(A ∪ B) = n(A) + n(B) − n(A ∩ B). We subtract the overlap because it was counted twice.</p><div class='ex'>40 students: 25 Physics, 18 Chemistry, 8 both.<br>Physics only = 25 − 8 = 17. Chemistry only = 18 − 8 = 10. At least one subject = 17 + 8 + 10 = 35. Neither = 40 − 35 = 5.</div><h3>5. Three sets</h3><p>n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A ∩ B) − n(A ∩ C) − n(B ∩ C) + n(A ∩ B ∩ C). On a Venn diagram, fill in the centre first, then the three pair overlaps, then the single-set regions.</p><div class='ex'>60 students: 30 play football (F), 25 volleyball (V), 20 athletics (A); 12 play F and V, 8 play F and A, 6 play V and A; 3 play all three.<br>F and V only = 12 − 3 = 9, F and A only = 8 − 3 = 5, V and A only = 6 − 3 = 3.<br>F only = 30 − 9 − 5 − 3 = 13, V only = 25 − 9 − 3 − 3 = 10, A only = 20 − 5 − 3 − 3 = 9.<br>Total in a sport = 3 + 9 + 5 + 3 + 13 + 10 + 9 = 52, so 60 − 52 = 8 play none.</div><h3>6. Laws of sets</h3><p>De Morgan’s laws: (A ∪ B)′ = A′ ∩ B′ and (A ∩ B)′ = A′ ∪ B′. Also A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C).</p><h3>Common mistakes</h3><ul><li>Forgetting to subtract the overlap, which counts people twice.</li><li>Confusing ∈ (element of) with ⊂ (subset of).</li><li>Forgetting that ∅ is a subset of every set.</li></ul><p class='tip'>Exam tip: in a Venn word problem, fill the innermost overlap first and work outward. Check that all regions add up to the total.</p>`],
["Number bases",[
[1,"Convert 1011₂ to base 10.",["9","10","11","13"],2,"1011₂ = 8 + 0 + 2 + 1 = 11."],
[2,"Convert 45 (base 10) to base 2.",["101101","110101","101011","100111"],0,"Divide by 2 repeatedly: remainders read upward give 101101. Check: 32 + 8 + 4 + 1 = 45."],
[3,"Find x if 13ₓ × 2 = 32ₓ.",["3","4","5","6"],1,"13ₓ = x + 3 and 32ₓ = 3x + 2. So 2(x + 3) = 3x + 2, which gives x = 4."]],
`<h3>1. Place value in any base</h3><p>We normally count in base 10, where each place is worth ten times the one to its right. In base b, each place is worth b times the one to its right, and the only digits allowed are 0 to b − 1. In base 5 the digits are 0–4, and in base 2 they are 0 and 1.</p><h3>2. From base b to base 10</h3><p>Multiply each digit by its place value and add.</p><div class='ex'>1011₂ = 1×8 + 0×4 + 1×2 + 1×1 = 11<br>234₅ = 2×25 + 3×5 + 4×1 = 69<br>1F₁₆ = 1×16 + 15 = 31 (in base 16, A = 10, B = 11, …, F = 15)</div><h3>3. From base 10 to base b</h3><p>Divide repeatedly by b and keep the remainders. Read the remainders from <b>bottom to top</b>.</p><div class='ex'>45 to base 2: 45 ÷ 2 = 22 r 1; 22 ÷ 2 = 11 r 0; 11 ÷ 2 = 5 r 1; 5 ÷ 2 = 2 r 1; 2 ÷ 2 = 1 r 0; 1 ÷ 2 = 0 r 1. Reading upward: 101101₂.<br>100 to base 5: 100 ÷ 5 = 20 r 0; 20 ÷ 5 = 4 r 0; 4 ÷ 5 = 0 r 4. So 100 = 400₅.</div><h3>4. Converting between two non-decimal bases</h3><p>Go through base 10. For 213₄ to base 5: 213₄ = 2×16 + 1×4 + 3 = 39. Then 39 ÷ 5 = 7 r 4, 7 ÷ 5 = 1 r 2, 1 ÷ 5 = 0 r 1, giving 124₅.</p><h3>5. Arithmetic in other bases</h3><p>Work column by column as usual, but carry when a column reaches the base, not 10.</p><div class='ex'>Addition: 1011₂ + 110₂. Convert: 11 + 6 = 17 = 10001₂. In columns: 1 + 0 = 1; 1 + 1 = 10 (write 0, carry 1); 0 + 1 + 1 = 10 (write 0, carry 1); 1 + 1 = 10; giving 10001.<br>Multiplication: 23₅ × 4₅. 23₅ = 13, and 13 × 4 = 52 = 202₅.</div><h3>6. Finding an unknown base</h3><p>Write each number as an expression in x, then solve the equation. If 24ₓ = 20 (in base 10), then 2x + 4 = 20, so x = 8. Remember the base must be larger than every digit that appears.</p><h3>7. Why it matters</h3><p>Computers store everything in binary (base 2). Hexadecimal (base 16) is a compact way of writing binary and is used for colours on web pages and for memory addresses.</p><h3>Common mistakes</h3><ul><li>Using a digit that is too large for the base, such as a 5 in base 5.</li><li>Reading the remainders from top to bottom instead of bottom to top.</li><li>Carrying 10 instead of the base value.</li></ul><p class='tip'>Exam tip: always check a conversion by converting back to base 10.</p>`],
["Angles and polygons",[
[1,"What is the sum of the angles in a triangle?",["90°","180°","270°","360°"],1,"The three interior angles of any triangle add up to 180°."],
[2,"What is the sum of the interior angles of a hexagon?",["540°","720°","900°","1,080°"],1,"(n − 2) × 180° = 4 × 180° = 720°."],
[3,"Each exterior angle of a regular polygon is 24°. How many sides does it have?",["12","15","18","20"],1,"The exterior angles add up to 360°, so n = 360 ÷ 24 = 15."]],
`<h3>1. Basic angle facts</h3><ul><li>Angles on a straight line add up to 180°.</li><li>Angles around a point add up to 360°.</li><li>Vertically opposite angles are equal.</li><li>The three angles of a triangle add up to 180°.</li><li>An exterior angle of a triangle equals the sum of the two opposite interior angles.</li></ul><h3>2. Parallel lines</h3><p>When a line (a transversal) crosses two parallel lines: <b>corresponding</b> angles are equal (an F shape), <b>alternate</b> angles are equal (a Z shape), and <b>co-interior</b> angles add up to 180° (a C shape). If one co-interior angle is 115°, the other is 180° − 115° = 65°.</p><h3>3. Triangles</h3><ul><li><b>Equilateral:</b> three equal sides and three 60° angles.</li><li><b>Isosceles:</b> two equal sides, and the base angles opposite them are equal. With an apex angle of 40°, each base angle is (180 − 40) ÷ 2 = 70°.</li><li><b>Right-angled:</b> one 90° angle.</li></ul><h3>4. Quadrilaterals</h3><p>The angles of any quadrilateral add up to 360°.</p><ul><li><b>Parallelogram:</b> opposite sides parallel and equal, opposite angles equal.</li><li><b>Rhombus:</b> a parallelogram with four equal sides. The diagonals cross at 90°.</li><li><b>Rectangle:</b> four right angles, and the diagonals are equal.</li><li><b>Square:</b> four equal sides and four right angles.</li><li><b>Kite:</b> two pairs of equal adjacent sides, and one diagonal bisects the other at 90°.</li><li><b>Trapezium:</b> one pair of parallel sides.</li></ul><h3>5. Polygons</h3><p>The interior angles of an n-sided polygon add up to (n − 2) × 180°. The exterior angles always add up to 360°. For a <b>regular</b> polygon, each exterior angle is 360° ÷ n and each interior angle is 180° − the exterior angle.</p><div class='ex'>Regular hexagon: the interior sum is 720°, each interior angle is 120° and each exterior angle is 60°.<br>If each exterior angle is 24°, then n = 360 ÷ 24 = 15.<br>If each interior angle is 150°, the exterior angle is 30°, so n = 12.</div><h3>6. Angle problems with algebra</h3><p>Write an equation from the angle rule, then solve it.</p><div class='ex'>The angles of a triangle are 2x, 3x + 10 and x + 20. Then 6x + 30 = 180, so x = 25 and the angles are 50°, 85° and 45°. Check: 50 + 85 + 45 = 180 ✓</div><h3>Common mistakes</h3><ul><li>Mixing up alternate and co-interior angles. Alternate are equal, co-interior add to 180°.</li><li>Using the exterior-angle rule on an irregular polygon.</li><li>Forgetting that a polygon with n sides has n − 2 triangles inside it.</li></ul><p class='tip'>Exam tip: write the reason beside each angle you find (for example ‘alternate angles’). Examiners award marks for the reasoning.</p>`]]},
{n:"Integrated Science",g:0,t:[
["Photosynthesis",[
[1,"Which gas do plants take in for photosynthesis?",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],2,"Plants use carbon dioxide, water and light to make glucose."],
[2,"Where in a plant cell does photosynthesis take place?",["Mitochondria","Nucleus","Chloroplast","Ribosome"],2,"Chloroplasts contain chlorophyll, which absorbs light."],
[3,"A leaf kept in darkness for 48 hours shows no blue-black colour with iodine. Why?",["It has no chlorophyll","Its starch was used up because photosynthesis could not occur","Iodine only reacts with sugar","The leaf absorbed water"],1,"Without light there is no new starch, and the stored starch is used for respiration."]],`<p>Photosynthesis is how green plants make food using light energy.</p><p><b>Word equation:</b> carbon dioxide + water → glucose + oxygen (needs light and chlorophyll).</p><ul><li>It happens in chloroplasts, mainly in leaves.</li><li>Carbon dioxide enters through the stomata, and water comes up from the roots.</li><li>Extra glucose is stored as starch. Iodine turns blue-black when starch is present.</li></ul><p>No light means no new starch, which is why a leaf kept in the dark tests negative.</p>`],
["Matter",[
[1,"Which of these is a physical change?",["Rusting of iron","Burning of wood","Melting of ice","Cooking an egg"],2,"Melting changes state only. No new substance forms."],
[2,"Which method separates salt from salt solution?",["Filtration","Evaporation","Decantation","Using a magnet"],1,"Evaporation removes the water and leaves the salt."],
[3,"An atom has 11 protons and 12 neutrons. What is its mass number?",["11","12","23","1"],2,"Mass number = protons + neutrons = 23."]],`<p>Matter is anything that has mass and takes up space. It exists as a solid, liquid or gas.</p><ul><li><b>Physical change:</b> no new substance forms (melting, boiling). It is usually easy to reverse.</li><li><b>Chemical change:</b> a new substance forms (rusting, burning, cooking).</li><li><b>Separating mixtures:</b> filtration for a solid in a liquid, evaporation to recover a dissolved solid, a magnet for magnetic materials.</li></ul><p>An atom has protons, neutrons and electrons. <b>Mass number = protons + neutrons</b>, and the atomic number is the number of protons.</p>`],
["Cells",[
[1,"Which part of the cell controls its activities?",["Mitochondrion","Nucleus","Ribosome","Vacuole"],1,"The nucleus holds the DNA and controls what the cell does."],
[2,"Which structure is found in plant cells but not in animal cells?",["Cell membrane","Nucleus","Cell wall","Mitochondrion"],2,"Plant cells have a cellulose cell wall. Animal cells do not."],
[3,"A piece of potato placed in strong salt solution becomes soft and limp. Why?",["Salt enters by active transport","Water leaves the cells by osmosis","Water enters the cells by osmosis","Starch dissolves in the salt"],1,"The salt solution is more concentrated than the cell sap, so water moves out of the cells by osmosis and they lose their firmness."]],
`<h3>1. The cell</h3><p>The cell is the basic unit of life. All living things are made of cells, and all cells come from existing cells. Most are too small to see without a microscope.</p><h3>2. Parts of a cell and what they do</h3><ul><li><b>Nucleus:</b> contains DNA and controls the cell’s activities.</li><li><b>Cell membrane:</b> controls what enters and leaves the cell.</li><li><b>Cytoplasm:</b> the jelly-like fluid where many chemical reactions happen.</li><li><b>Mitochondria:</b> release energy from food in respiration.</li><li><b>Ribosomes:</b> make proteins.</li><li><b>Chloroplasts</b> (plants only): contain chlorophyll for photosynthesis.</li><li><b>Cell wall</b> (plants only): made of cellulose, gives support and shape.</li><li><b>Large vacuole</b> (plants): holds cell sap and helps keep the cell firm.</li></ul><p>Plant cells have a cell wall, chloroplasts and a large vacuole, which animal cells lack. Both types have a nucleus, membrane, cytoplasm and mitochondria.</p><h3>3. Specialised cells</h3><ul><li><b>Red blood cell:</b> disc-shaped, no nucleus, full of haemoglobin to carry oxygen.</li><li><b>Root hair cell:</b> long extension gives a large surface area to take in water.</li><li><b>Nerve cell:</b> very long, carries electrical impulses.</li><li><b>Palisade cell:</b> packed with chloroplasts to absorb light.</li><li><b>Xylem:</b> dead, hollow tubes that carry water up the plant.</li></ul><h3>4. Levels of organisation</h3><p>Cells of one kind form a <b>tissue</b>. Different tissues form an <b>organ</b>. Organs working together form an <b>organ system</b>, and the systems make up the whole <b>organism</b>. Example: muscle cells → muscle tissue → stomach → digestive system → human.</p><h3>5. Movement of substances</h3><ul><li><b>Diffusion:</b> particles move from a region of high concentration to low concentration. No energy is needed.</li><li><b>Osmosis:</b> water moves through a partially permeable membrane from a dilute solution to a more concentrated one.</li><li><b>Active transport:</b> particles move against the concentration gradient, using energy from respiration.</li></ul><div class='ex'>A potato strip in pure water takes in water by osmosis and becomes firm (turgid). A strip in strong salt solution loses water and becomes soft and limp (flaccid). In plant cells this loss makes the membrane pull away from the wall, which is called plasmolysis.</div><h3>6. Cell division</h3><ul><li><b>Mitosis:</b> one cell divides into two identical cells with the same number of chromosomes. It is used for growth and repair.</li><li><b>Meiosis:</b> makes gametes (sex cells) with half the chromosomes. Human body cells have 46 chromosomes and gametes have 23. It also creates genetic variation.</li></ul><h3>7. The microscope</h3><p>Magnification = size of image ÷ actual size. If a cell appears 20 mm long and is really 0.1 mm long, the magnification is 20 ÷ 0.1 = ×200.</p><h3>Common mistakes</h3><ul><li>Mixing up osmosis (water only, through a membrane) and diffusion (any particles).</li><li>Saying plant cells have no mitochondria. They do.</li><li>Mixing up mitosis (identical cells, growth) and meiosis (gametes, half the chromosomes).</li></ul><p class='tip'>Exam tip: for any osmosis question, find which solution is more concentrated. Water always moves toward it.</p>`]]},
{n:"Social Studies",g:0,t:[
["Ghana’s history",[
[1,"In which year did Ghana gain independence?",["1951","1957","1960","1966"],1,"Ghana became independent on 6 March 1957."],
[2,"Who was Ghana’s first President?",["J.B. Danquah","Kwame Nkrumah","K.A. Busia","J.J. Rawlings"],1,"Kwame Nkrumah became first President when Ghana became a republic."],
[3,"In which year did Ghana become a republic?",["1957","1960","1966","1979"],1,"Ghana became a republic on 1 July 1960."]],`<p>The Gold Coast was a British colony. Under Kwame Nkrumah and the Convention People’s Party, it became independent on <b>6 March 1957</b> and took the name Ghana. It was the first sub-Saharan African colony to gain independence.</p><p>Ghana became a <b>republic on 1 July 1960</b>, and Nkrumah became its first President. A republic has an elected head of state instead of a monarch.</p>`],
["Citizenship and government",[
[1,"Which of these is a duty of a Ghanaian citizen?",["Paying taxes","Receiving a pension","Owning a car","Travelling abroad"],0,"Paying taxes funds public services and is a civic duty."],
[2,"In which year was Ghana’s current Constitution adopted?",["1957","1979","1992","2000"],2,"The Fourth Republic Constitution came into force in 1993 after a 1992 referendum."],
[3,"What is the minimum age to be elected President under the 1992 Constitution?",["18","35","40","45"],2,"The Constitution requires a presidential candidate to be at least 40."]],`<p>A citizen is a person who belongs to a country by birth, descent or registration. Citizens have <b>rights</b> (such as freedom of speech and education) and <b>duties</b> (such as paying taxes, obeying the law and voting).</p><p>Ghana is governed under the <b>1992 Constitution</b>, the supreme law. It sets out the powers of the Executive, the Legislature and the Judiciary. It also says a presidential candidate must be at least 40 years old.</p>`]]},

{n:"Physics",g:1,t:[
["Electricity",[
[1,"What is the SI unit of electric current?",["Volt","Ampere","Ohm","Watt"],1,"Current is measured in amperes (A)."],
[2,"A 12 V supply is connected across a 4 Ω resistor. What is the current?",["0.33 A","3 A","8 A","48 A"],1,"I = V ÷ R = 12 ÷ 4 = 3 A."],
[3,"Two 6 Ω resistors are connected in parallel. What is the total resistance?",["12 Ω","6 Ω","3 Ω","1.5 Ω"],2,"1/R = 1/6 + 1/6 = 2/6, so R = 3 Ω."]],`<p>Current is the flow of charge, measured in amperes (A). Voltage is measured in volts (V) and resistance in ohms (Ω).</p><p><b>Ohm’s law:</b> V = I × R, so I = V ÷ R.</p><ul><li><b>Series:</b> add the resistances. R = R1 + R2.</li><li><b>Parallel:</b> 1/R = 1/R1 + 1/R2. Two equal resistors in parallel give half the value of one.</li></ul>`],
["Motion",[
[1,"A car travels 100 m in 20 s. What is its average speed?",["2000 m/s","5 m/s","0.2 m/s","80 m/s"],1,"Speed = distance ÷ time = 100 ÷ 20 = 5 m/s."],
[2,"A body accelerates uniformly from rest to 20 m/s in 5 s. What is its acceleration?",["100 m/s²","25 m/s²","4 m/s²","15 m/s²"],2,"a = (v − u) ÷ t = 20 ÷ 5 = 4 m/s²."],
[3,"A body starts from rest and accelerates at 4 m/s². How far does it travel in 5 s?",["20 m","50 m","100 m","10 m"],1,"s = ½at² = ½ × 4 × 25 = 50 m."]],`<p><b>Speed</b> = distance ÷ time. <b>Acceleration</b> = (final speed − initial speed) ÷ time.</p><p>For uniform acceleration from rest, <b>distance s = ½ a t²</b>. With a = 4 m/s² and t = 5 s: s = ½ × 4 × 25 = 50 m.</p><p>Units to remember: m/s for speed and m/s² for acceleration.</p>`]]},

const LV=["","Easy","Medium","Hard"],$=id=>document.getElementById(id);
/* Which form (1, 2 or 3) each topic belongs to. Default is Form 1. */
const G={"Surds":2,"Indices and logarithms":2,"Simultaneous equations":2,"Modular arithmetic":2,"Transformations":2,"Statistics":2,"Ratios, rates and proportion":2,"Sequences and series":2,"Surface area and volume":2,"Probability":2,"Vectors and trigonometry":2,"Electricity":2};
const gr=n=>G[n]||1;
let v={p:"home"};
function go(p,a,b){
  if(p==="home")v={p};
  else if(p==="sub")v={p,s:a,f:b||(v.t!==undefined&&v.s===a?gr(S[a].t[v.t][0]):Math.min(...S[a].t.map(t=>gr(t[0]))))};
  else if(p==="lesson")v={p,s:a,t:b};
  else if(p==="quiz"){const qs=S[a].t[b][1].slice().sort((x,y)=>x[0]-y[0]);v={p,s:a,t:b,qs,i:0,sel:null,res:[]}}
  render();window.scrollTo(0,0);
}
function pick(k){if(v.sel!==null)return;v.sel=k;v.res.push(k===v.qs[v.i][3]?1:0);render()}
function nxt(){v.i++;v.sel=null;render()}
function render(){
  const m=$("app");
  if(v.p==="home"){
    const n=S.reduce((a,s)=>a+s.t.reduce((b,t)=>b+t[1].length,0),0);
    m.innerHTML=`<h1>Every SHS subject, <mark>topic by topic</mark>.</h1>
    <p class="lead">Pick a subject, choose a topic and work through questions that start easy and get harder. ${n} questions so far, with more added each week.</p>`+
    ["Core subjects","Elective subjects"].map((h,g)=>`<h2>${h}</h2><div class="grid">`+
      S.map((s,i)=>s.g===g?`<button class="tile" ${s.t.length?"":"disabled"} onclick="go('sub',${i})">${s.n}<small>${s.t.length?s.t.length+" topics":"Coming soon"}</small></button>`:"").join("")+`</div>`).join("");
  }else if(v.p==="sub"){
    const s=S[v.s];
    m.innerHTML=`<button class="back" onclick="go('home')">← All subjects</button><h1>${s.n}</h1><p class="lead">Pick your form, choose a topic, read the lesson, then practise from Level 1 to Level 3.</p><div class="chips" role="group" aria-label="Choose your form">${[1,2,3].map(f=>`<button class="chip" aria-pressed="${f===v.f}" onclick="go('sub',${v.s},${f})">Form ${f} (${s.t.filter(t=>gr(t[0])===f).length})</button>`).join("")}</div><div class="grid">`+
      (s.t.map((t,j)=>gr(t[0])===v.f?`<button class="tile" onclick="go('lesson',${v.s},${j})">${t[0]}<small>Lesson + ${t[1].length} questions</small></button>`:"").join("")||`<p class="lead">Form ${v.f} topics are coming soon.</p>`)+`</div>`;
  }else if(v.p==="lesson"){
    const s=S[v.s],t=s.t[v.t];
    m.innerHTML=`<button class="back" onclick="go('sub',${v.s})">← ${s.n} topics</button><h1>${t[0]}</h1><div class="card lesson">${t[2]||"<p>Lesson coming soon.</p>"}</div><p><button class="btn" onclick="go('quiz',${v.s},${v.t})">Start practice (${t[1].length} questions)</button></p>`;
  }else{
    const s=S[v.s],t=s.t[v.t],q=v.qs[v.i];
    if(v.i>=v.qs.length){
      const tot=v.res.reduce((a,b)=>a+b,0);
      const by=[1,2,3].map(d=>{const idx=v.qs.map((x,k)=>x[0]===d?k:-1).filter(k=>k>=0);return idx.length?`<p><span class="badge l${d}">${LV[d]}</span> ${idx.reduce((a,k)=>a+v.res[k],0)} of ${idx.length} correct</p>`:""}).join("");
      m.innerHTML=`<button class="back" onclick="go('sub',${v.s})">← ${s.n} topics</button><div class="card"><h2 style="margin-top:0">${t[0]}: ${tot} of ${v.qs.length}</h2>${by}<p class="why">${tot===v.qs.length?"Full marks. Try another topic.":"Review the explanations, then try again to beat your score."}</p><button class="btn" onclick="go('quiz',${v.s},${v.t})">Try again</button></div>`;
      return;
    }
    const done=v.i+(v.sel!==null?1:0);
    m.innerHTML=`<button class="back" onclick="go('sub',${v.s})">← ${s.n} topics</button>
    <div class="card"><div class="row"><span class="badge l${q[0]}">Level ${q[0]}: ${LV[q[0]]}</span><span class="why" style="margin:0">${t[0]} · ${v.i+1} of ${v.qs.length}</span></div>
    <div class="bar"><i style="width:${done/v.qs.length*100}%"></i></div>
    <div class="q">${q[1]}</div>`+
    q[2].map((o,k)=>`<button class="opt ${v.sel!==null?(k===q[3]?"right":k===v.sel?"wrong":""):""}" ${v.sel!==null?"disabled":""} onclick="pick(${k})">${o}</button>`).join("")+
    (v.sel!==null?`<div class="why">${v.sel===q[3]?"Correct. ":"Not quite. "}${q[4]}</div><button class="btn" onclick="nxt()">${v.i===v.qs.length-1?"See results":"Next question"}</button>`:"")+`</div>`;
  }
}
render();
</script>
